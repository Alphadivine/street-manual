  ]},
  { v:2, items:[
    "<b>Paste a list</b> — adding a recipe no longer means typing ingredients one row at a time. Paste the bench's list in whatever shape it comes and it fills the rows for you.",
    "<b>Undo</b> — deleting anything now leaves an Undo button for seven seconds. Screenshots survive that window too, so an undone delete comes back whole.",
    "<b>Loop protection</b> — an item can't be its own ingredient any more, and a longer loop gets named so it can be fixed.",
    "<b>Craft time in minutes</b> — the time box takes minutes or seconds, and shows you what your number means.",
    "<b>Prep in planner</b> — a heist can push all its gear into the Planner in one click."
  ]}
];
function guideSeen(){ try{ return parseInt(localStorage.getItem(SEEN_GUIDE)) || 0 }catch(e){ return 0 } }
function markGuideSeen(){ try{ localStorage.setItem(SEEN_GUIDE, String(GUIDE_VERSION)) }catch(e){} }
function unseenNews(){ const v = guideSeen(); return v ? WHATS_NEW.filter(n=>n.v > v) : []; }

function openGuide(){
  const news = unseenNews();
  markGuideSeen();
  paintNewsDot();
  const tabs = [
    ["Catalogue", "Every item and material. Search by name — or by ingredient, so typing <b>copper</b> shows everything that eats copper."],
    ["Planner",   "The one that saves you time. Pick what you want to make, get one shopping list."],
    ["Benches",   "Where each bench is, with photos, and everything it makes."],
    ["Drop Offs", "Where to ditch a hot car or swap into a clean one."],
    ["Bus Blocks","Spots to park something big and choke the road behind you."],
    ["Heists",    "Crew size, gear, the hacks to expect — each with a picture of it — and the steps."]
  ];

  openModal(`
    <div class="mhead">
      <div style="flex:1"><h2>How to use ${esc(CONFIG.APP_NAME)}</h2>
      <div class="sub">Two minutes and you'll know the whole thing.</div></div>
      <button class="x" data-close>×</button>
    </div>
    <div class="mbody guide">

      ${news.length? `<div class="whatsnew">
        <div class="sec-title" style="margin:0 0 8px;color:var(--acc)">New since you last looked</div>
        <ul>${news.flatMap(n=>n.items).map(i=>`<li>${i}</li>`).join("")}</ul>
      </div>`:""}

      <p class="lead">Everything the crew knows about crafting and running the city, in one place.
      <b>Anyone can read it</b> — searching, browsing and the Planner all work without a code.</p>

      <div class="sec-title">The tabs</div>
      <dl class="glist">
        ${tabs.map(([n,d])=>`<div><dt>${n}</dt><dd>${d}</dd></div>`).join("")}
      </dl>

      <div class="sec-title" style="margin-top:22px">Start with the Planner</div>
      <p>Say you need three pistols. Type the name, set the quantity, hit <b>Add</b>. You get back:</p>
      <ol class="steps">
        <li><b>A shopping list</b> of raw materials — not just the recipe's own ingredients, but
          everything underneath it. If a pistol needs weapon parts and weapon parts need steel, the
          steel is on the list.</li>
        <li><b>What you already have</b>, taken off the top. Type your counts into the
          <i>On hand</i> boxes and the list shrinks to what's actually missing.</li>
        <li><b>A bench route, in order.</b> Sub-crafts come first, so you never walk back to a bench
          you've already been to.</li>
        <li><b>Blueprints you're missing</b>, if the recipe needs one — before you get there, not after.</li>
      </ol>
      <p>A heist can fill the Planner for you: open one and hit <b>Prep in planner</b> — every piece
      of gear that's in the catalogue goes in at once.</p>
      <p class="tiny muted">Your on-hand counts are yours alone. They're saved on your own device and
      nobody else sees or changes them.</p>

      <div class="sec-title" style="margin-top:22px">About the total time</div>
      <p><b>Treat the total as a floor.</b> It adds up every craft in the plan as if you ran them
      back-to-back with the materials already in hand. It doesn't know about anything the city puts
      in the way — a bench that only lets you run so much per window, a cooldown, a queue, or the
      walking between stops.</p>
      <p>So a plan that reads <i>40m</i> is 40 minutes of crafting, not 40 minutes of your evening.
      If a bench limits you, split the run and use the total to compare two routes against each
      other rather than to set a clock.</p>

      <div class="sec-title" style="margin-top:22px">When there's more than one way to make it</div>
      <p>Some things can be made more than one way — different ingredients, sometimes a different
      bench. Those show <b>2 ways</b> on the card, and opening the item lists every recipe with its
      own bench, time and ingredients.</p>
      <p>In the Planner you get a <b>picker</b> at the top: choose a route and the shopping list, the
      bench stops and the total time all update. Your choice is remembered on this device, so you
      don't reset it every time.</p>

      <div class="sec-title" style="margin-top:22px">Reading a card</div>
      <table class="legend">
        <tr><td><span class="badge raw">MATERIAL</span></td>
            <td>A raw material — you gather or buy it, you don't craft it.</td></tr>
        <tr><td><span class="badge bp">BLUEPRINT</span></td>
            <td>A blueprint. The card tells you where it comes from.</td></tr>
        <tr><td><span class="badge gap">2 gaps</span></td>
            <td>Something's missing that makes the numbers wrong — usually no bench or no craft time.
                Worth telling whoever maintains this.</td></tr>
        <tr><td><span style="color:#9085e9;font-size:15px">◆</span></td>
            <td>This one needs a blueprint before you can craft it.</td></tr>
        <tr><td><span class="tag tbench" style="${S.benches[0]? benchTagStyle(S.benches[0].id) : "background:rgba(57,135,229,.15);color:#3987e5;border:1px solid rgba(57,135,229,.42)"}">${esc((S.benches[0]||{}).name || "Bench name")}</span></td>
            <td>The bench that makes it. <b>Every bench has its own colour</b>, the same colour everywhere
                it appears — so you learn to spot it without reading.</td></tr>
        <tr><td><span style="display:inline-block;width:34px;height:22px;border:1px solid var(--line);border-left:3px solid ${S.benches[0]? benchColor(S.benches[0].id) : "#3987e5"};border-radius:var(--r);background:rgba(255,255,255,.03)"></span></td>
            <td>That same colour runs down the <b>left edge of the card</b>. Scan the grid and the
                benches group themselves. No stripe means it isn't crafted — a raw material or a
                blueprint — or that it's made at more than one bench.</td></tr>
      </table>
      <p>Click any card for the full recipe, the complete breakdown down to raw materials, and
      everything else that uses it as an ingredient.</p>

      <div class="sec-title" style="margin-top:22px">Finding things</div>
      <ul class="glist2">
        <li>Search covers names, ingredients, benches and categories. Press <kbd>/</kbd> to jump to it.</li>
        <li>The chips filter by kind; <b>bench</b> and <b>category</b> are the dropdowns beside the search box.</li>
        <li><b>✕ Clear</b> appears on the right whenever something's filtered and resets the lot.</li>
        <li><kbd>Esc</kbd> closes anything that's open.</li>
      </ul>

      <div class="sec-title" style="margin-top:22px">${S.canEdit? "Adding and changing things" : "Want to add something?"}</div>
      ${S.canEdit? `
        <p>You're unlocked, so you'll see a <b>+</b> button bottom-right — it adds whatever the tab
        you're on is for. On the Catalogue: name the item, list its ingredients, pick the bench.
        That's the minimum; craft time, level and the rest can wait.</p>
        <p>Everyone else opens this <b>read-only</b> until they're given the <b>edit code</b>. Pass it
        to whoever should be maintaining it with you; they enter it once under
        <b>View only · unlock</b> and that browser remembers it.</p>
        <p>Click <b>Editing on</b> in the header to <b>turn editing off</b> on this browser — handy if
        you leave the page open or hand the machine over, and it stays off until you switch it back
        on. No code needed to return; you keep your access either way. The same panel has
        <b>Preview as viewer</b>, which shows you exactly what the crew sees for as long as you want
        to look.</p>
        <ul class="glist2">
          <li><b>Paste a list</b> instead of typing rows. Copy the bench's ingredients —
              <i>20x Iron, 25x Metal Scrap, 1x Oak Plank</i> — hit <b>Paste a list</b>, and it works
              out the names and quantities. One per line, <i>Iron x20</i> and <i>Copper: 2</i> all work too.</li>
          <li>Name an ingredient that doesn't exist yet and it gets created for you, so the catalogue
              fills itself in as you type.</li>
          <li>Craft time takes <b>seconds or minutes</b> — there's a unit dropdown, and it shows you
              what your number means underneath.</li>
          <li>Screenshots: click, drag, or just <b>paste</b> straight from a fresh grab.</li>
          <li>On a heist, <b>every hack takes its own screenshot</b> — the square on the hack's row.
              Click it or drag a picture onto it. One per hack, so the crew can tell a circle hack
              from a keypad at a glance rather than by name.</li>
          <li>Deleted the wrong thing? There's an <b>Undo</b> button in the message for seven seconds.</li>
          <li>Can something be made two ways? Add the second under <b>Other ways to make it</b> at the
              bottom of the form — its own bench, time and ingredients.</li>
          <li>An item can't be its own ingredient — if you try, it says so rather than letting the
              Planner produce nonsense later.</li>
        </ul>`
      : `
        <p>You're in <b>view only</b>, which is the normal state — that's why there's no + button.
        Adding and changing needs the crew's edit code. If you should have it, ask whoever set this up,
        then hit <b>View only · unlock</b> at the top and enter it. It's remembered on this browser
        after that.</p>
        <p class="tiny muted">Spotted something wrong or missing? Tell an editor rather than working
        around it — the whole point is that everyone reads the same thing.</p>`}

      <div class="sec-title" style="margin-top:22px">On your phone</div>
      <p><b>Add it to your home screen</b> and it opens like a real app — the Unholy mark as the
      icon, full screen, no address bar in the way. Everything works the same, laid out for a
      narrow screen.</p>
      <ul class="glist2">
        <li><b>iPhone:</b> open it in Safari, hit <b>Share</b>, then <b>Add to Home Screen</b>.</li>
        <li><b>Android:</b> Chrome's menu, then <b>Install app</b> or <b>Add to Home screen</b>.</li>
      </ul>
      <p class="tiny muted">It's the same page either way — your unlock, your on-hand counts and your
      chosen recipes carry over from the browser you set it up in.</p>

      <p class="tiny muted" style="margin-top:22px">You can reopen this any time — <b>How to use</b>, top right.</p>
    </div>
    <div class="mfoot"><button class="btn primary" data-close>Got it</button></div>`, "wide");
}

function openUnlock(){
  // stepping out of a preview needs no dialog
  if(S.preview){ S.preview = false; applyEdit(); paintLock(); render(); return toast("Editing back on"); }

  if(S.editor) return openModal(`
    <div class="mhead"><div style="flex:1"><h2>${S.canEdit? "Editing is on":"Editing is off"}</h2>
      <div class="sub">${S.canEdit
        ? "This device can add and change things."
        : "You still have access — editing is just switched off on this browser."}</div></div>
      <button class="x" data-close>×</button></div>
    <div class="mbody">
      ${S.canEdit? `
        <div class="sec-title">Turn editing off</div>
        <dl class="glist">
          <div><dt>Preview as viewer</dt><dd>See exactly what the crew sees. Nothing is given up —
            one click puts you back. Good for checking a change reads properly.</dd></div>
          <div><dt>Turn editing off</dt><dd>Sticks until you turn it back on, including after a reload.
            Stops accidental edits if you leave this open or hand the machine over. You won't need the
            code again — it's this browser choosing not to edit, not losing access.</dd></div>
        </dl>
        <div class="tiny muted" style="margin-top:12px">To actually take a device's access away, delete its
        row from <b>boards → ${esc(BOARD)} → editors</b> in the Firebase console. Clearing site data does
        it too.</div>`
      : `<div class="tiny muted">Editing is switched off on this browser. Turn it back on below — no
         code needed, since you still have access.</div>`}
    </div>
    <div class="mfoot">
      ${S.canEdit? `<button class="btn" id="previewBtn">Preview as viewer</button>
        <div class="spacer"></div>
        <button class="btn danger" id="lockBtnOff">Turn editing off</button>`
      : `<div class="spacer"></div><button class="btn primary" id="lockBtnOn">Turn editing back on</button>`}
      <button class="btn ghost" data-close>Close</button>
    </div>`);

  openModal(`
    <div class="mhead"><div style="flex:1"><h2>Unlock editing</h2>
      <div class="sub">Everyone can read and use the planner. Adding and changing needs the crew's edit code.</div></div>
      <button class="x" data-close>×</button></div>
    <div class="mbody">
      <label class="f">Edit code</label>
      <input id="u_code" type="password" placeholder="Ask whoever set this up" autofocus>
      <div class="tiny muted" style="margin-top:8px">Remembered on this browser once it works.</div>
      <div class="tiny" id="u_err" style="color:var(--bad);margin-top:8px"></div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn primary" id="u_go">Unlock</button>
    </div>`);

  const go = async ()=>{
    const code = $("#u_code").value.trim();
    if(!code) return;
    const btn = $("#u_go"); btn.disabled = true; btn.textContent = "Checking…";
    try{
      await claimEditor(code);
      closeModal(); paintLock(); render(); toast("Editing unlocked");
    }catch(err){
      btn.disabled = false; btn.textContent = "Unlock";
      $("#u_err").textContent = /permission|insufficient/i.test(err.message||"")
        ? "That code isn't right." : ("Couldn't check that: "+(err.message||err));
    }
  };
  $("#u_go").onclick = go;
  $("#u_code").onkeydown = e=>{ if(e.key==="Enter") go(); };
}

/* =====================================================================
   HOME SCREEN
   Add to Home Screen gives you a real icon and a full-screen window with no
   browser bar. The manifest has to be a URL, not inline, so it's built at
   runtime and handed over as a Blob — which keeps this one file.
   ===================================================================== */
function installHomeScreen(){
  try{
    const link = (rel, href, extra) => {
      const l = document.createElement("link");
      l.rel = rel; l.href = href;
      Object.assign(l, extra || {});
      document.head.appendChild(l);
    };
    link("apple-touch-icon", ICON_APPLE, { sizes:"180x180" });

    const manifest = {
      name:        CONFIG.APP_NAME,
      short_name:  CONFIG.APP_NAME,
      description: "Everything the crew knows about crafting and running the city, in one place.",
      start_url:   location.pathname + location.search,
      scope:       location.pathname.replace(/[^/]*$/, ""),
      display:     "standalone",
      orientation: "any",
      background_color: "#0a0c0f",
      theme_color:      "#0a0c0f",
      icons: [
        { src:ICON_192, sizes:"192x192", type:"image/png", purpose:"any" },
        { src:ICON_512, sizes:"512x512", type:"image/png", purpose:"any" },
        { src:ICON_512, sizes:"512x512", type:"image/png", purpose:"maskable" }
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:"application/manifest+json" }));
    link("manifest", url);
  }catch(err){ console.warn("home-screen setup skipped", err.message); }
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  document.title = CONFIG.APP_NAME;
  $("#brandName").textContent = CONFIG.APP_NAME;
  $("#brandSub").textContent  = CONFIG.APP_SUB;
  $("#brandMark").src = LOGO;
  $("#brandMark").alt = CONFIG.APP_NAME;
  const fav = document.createElement("link");
  fav.rel = "icon"; fav.type = "image/png"; fav.href = LOGO_FAV;
  document.head.appendChild(fav);
  installHomeScreen();
  initCloud();
  $("#modePill").className = "pill " + (CLOUD? "live":"solo");
  $("#modeTxt").textContent = CLOUD? "Shared · live" : "Solo · this device";

  // Keys are filled in but Firestore didn't come up — say so loudly rather than
  // silently writing to this device while the crew sees nothing.
  if(configured() && !CLOUD){
    $("#modePill").className = "pill solo";
    $("#modeTxt").textContent = "Offline · not syncing";
    toast("Can't reach Firebase — running on this device only", 1);
  }

  if(CLOUD){
    try{ await signIn(); await checkEditor(); }
    catch(err){ console.warn("sign-in failed", err.message); S.editor = false; applyEdit(); }
  }else{ S.editor = true; applyEdit(); }

  try{
    const d = await Store.loadAll();
    S.items = d.items; S.benches = d.benches; S.spots = d.spots||[]; reindex();
  }catch(err){
    console.error(err); toast("Couldn't load data: "+(err.message||err), 1);
  }
  render();

  // First visit on this browser: show them round without being asked. Someone
  // who's read an older version gets a dot instead of a modal in their face.
  if(!guideSeen()) openGuide();
  else paintNewsDot();

  Store.subscribe(async ()=>{
    try{
      const d = await Store.loadAll();
      S.items = d.items; S.benches = d.benches; S.spots = d.spots||[]; reindex();
      if($("#overlay").hidden) render();
    }catch(e){}
  });
}
// The Firebase SDK is a module script, so it finishes after this one. Wait for
// it when the keys are set; start straight away when they aren't.
if(!configured() || window.__fb || window.__fbFailed) boot();
else{
  let started = false;
  const go = ()=>{ if(!started){ started = true; boot(); } };
  window.addEventListener("fb-ready", go, {once:true});
  setTimeout(go, 8000);   // never leave the page stuck on "loading…"
}
</script>
</body>
