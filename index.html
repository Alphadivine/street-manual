<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Manual</title>
<script type="module">
// Firebase's official CDN build. Loads even when the keys below are blank —
// it just isn't used, and the app runs on this device only.
try{
  const [{ initializeApp }, fs, au] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"),
    import("https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js")
  ]);
  window.__fb = { initializeApp,
    getFirestore:fs.getFirestore, collection:fs.collection, doc:fs.doc,
    getDoc:fs.getDoc, getDocs:fs.getDocs, setDoc:fs.setDoc, deleteDoc:fs.deleteDoc,
    onSnapshot:fs.onSnapshot, writeBatch:fs.writeBatch,
    getAuth:au.getAuth, signInAnonymously:au.signInAnonymously };
}catch(err){
  console.error("Firebase SDK failed to load", err);
  window.__fbFailed = true;
}
window.dispatchEvent(new Event("fb-ready"));
</script>
<style>
/* ============================== CONFIG NOTE ==============================
   Scroll to the <script> at the bottom and edit the CONFIG block to set the
   app name and (optionally) your Firebase config for shared crew mode.
   ======================================================================== */

:root{
  --bg:#0a0c0f;
  --bg2:#0e1116;
  --panel:rgba(255,255,255,.045);
  --panel2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18);
  --txt:#e9edf2;
  --dim:#93a0b0;
  --dim2:#68758a;
  --acc:#4ade80;
  --acc2:#22d3ee;
  --warn:#fbbf24;
  --bad:#f87171;
  --gold:#facc15;
  --r:14px;
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--txt);
  font:15px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
body::before{
  content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(45% 40% at 18% 8%, rgba(74,222,128,.13), transparent 62%),
    radial-gradient(40% 38% at 88% 14%, rgba(34,211,238,.11), transparent 62%),
    radial-gradient(50% 45% at 50% 100%, rgba(250,204,21,.06), transparent 60%);
  filter:blur(20px);
}
a{color:var(--acc2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 90px}
header.top{
  position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);
  background:linear-gradient(to bottom,rgba(10,12,15,.94),rgba(10,12,15,.78));
  border-bottom:1px solid var(--line);
}
.topin{max-width:1240px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em;font-size:18px;white-space:nowrap}
.brand .mark{
  width:44px;height:52px;object-fit:contain;display:block;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));
}
@media(max-width:520px){.brand .mark{width:36px;height:42px}}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--dim2);letter-spacing:.14em;text-transform:uppercase;line-height:1}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
  white-space:nowrap;
}
.pill.live{color:var(--acc);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.10)}
.pill.solo{color:var(--warn);border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.08)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

nav.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 16px 10px;max-width:1240px;margin:0 auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  background:transparent;border:1px solid transparent;color:var(--dim);
  padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:650;font-size:13.5px;white-space:nowrap;
  transition:.15s;
}
nav.tabs button:hover{color:var(--txt);background:var(--panel)}
nav.tabs button.on{background:var(--panel2);border-color:var(--line2);color:var(--txt)}
nav.tabs button .n{font-size:11px;color:var(--dim2);margin-left:5px}

/* ---------- generic bits ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:650;font-size:13.5px;transition:.15s;
}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}
.btn.primary{background:linear-gradient(140deg,var(--acc),#2fbf6b);border-color:transparent;color:#06120c}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:rgba(248,113,113,.3)}
.btn.danger:hover{background:rgba(248,113,113,.12)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}

input,select,textarea{
  background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;width:100%;outline:none;font-size:16px;transition:.15s;
}
@media(min-width:700px){input,select,textarea{font-size:14px}}
input:focus,select:focus,textarea:focus{border-color:rgba(74,222,128,.55);background:rgba(0,0,0,.4)}
textarea{resize:vertical;min-height:64px}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2393a0b0'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:28px}
label.f{display:block;font-size:11px;font-weight:700;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;margin:0 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:620px){.grid3{grid-template-columns:1fr 1fr}}

.muted{color:var(--dim)}
.tiny{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:56px 20px;color:var(--dim2)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}
.sec-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin:0 0 10px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.search{position:relative;flex:1;min-width:190px}
.search input{padding-left:34px}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim2);pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;
  color:var(--dim);cursor:pointer;font-size:12.5px;font-weight:600;transition:.15s;
}
.chip:hover{color:var(--txt);border-color:var(--line2)}
.chip.on{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.4);color:var(--acc)}
.chip.warnchip.on{background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.4);color:var(--warn)}

/* ---------- item grid ---------- */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-items:start}
.item{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  cursor:pointer;transition:.15s;position:relative;overflow:hidden;
}
.item:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.item .nm{font-weight:700;font-size:14.5px;margin-bottom:3px;padding-right:52px}
.item .sub{font-size:12px;color:var(--dim2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .ing{margin-top:9px;font-size:12.5px;color:var(--dim);line-height:1.45}
.item .ing b{color:var(--txt);font-weight:600}
.item .badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.05em;padding:3px 7px;border-radius:6px}
.badge.raw{background:rgba(148,163,184,.16);color:#94a3b8}
.badge.bp{background:rgba(144,133,233,.18);color:#9085e9}
.tag.tbp{background:rgba(144,133,233,.15);color:#9085e9}
.badge.prof{background:rgba(74,222,128,.14);color:var(--acc)}
.badge.loss{background:rgba(248,113,113,.14);color:var(--bad)}
.badge.gap{background:rgba(251,191,36,.14);color:var(--warn)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--dim)}
.tag.tbench{background:rgba(34,211,238,.12);color:var(--acc2)}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;z-index:100;background:rgba(4,6,9,.72);backdrop-filter:blur(7px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;
}
.overlay[hidden]{display:none!important}
.modal{
  width:100%;max-width:760px;background:linear-gradient(180deg,#12161c,#0d1116);
  border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);
  animation:pop .18s ease-out;
}
.modal.wide{max-width:920px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;font-size:19px;font-weight:800}
.mhead .sub{font-size:12.5px;color:var(--dim2);margin-top:3px}
.mbody{padding:18px 20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.x{background:transparent;border:none;color:var(--dim2);font-size:24px;cursor:pointer;line-height:1;padding:0 2px}
.x:hover{color:var(--txt)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim2);font-weight:800;padding:0 8px 7px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- recipe tree ---------- */
.tree{font-size:13.5px}
.tnode{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.045)}
.tnode:last-child{border-bottom:none}
.tnode .q{font-weight:800;color:var(--acc);min-width:46px;font-variant-numeric:tabular-nums}
.tnode .nm{flex:1}
.tnode .nm.craftable{color:var(--acc2);cursor:pointer}
.tnode .nm.craftable:hover{text-decoration:underline}
.tnode .meta{font-size:11.5px;color:var(--dim2)}
.tnode.unknown .nm{color:var(--warn)}

/* ---------- ingredient rows ---------- */
.ingrow{display:grid;grid-template-columns:1fr 92px 34px;gap:8px;margin-bottom:7px;align-items:center}
.ingrow button{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--dim2);cursor:pointer;height:36px}
.ingrow button:hover{color:var(--bad);border-color:rgba(248,113,113,.35)}
.bprow{display:grid;grid-template-columns:1fr 108px 72px 34px;gap:8px;margin-bottom:7px;align-items:center}
@media(max-width:560px){.bprow{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
  .bprow .bp-n{grid-column:1/-1}}
.bprow button{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--dim2);cursor:pointer;height:36px}
.bprow button:hover{color:var(--bad);border-color:rgba(248,113,113,.35)}
.bprow input:disabled{opacity:.35}

/* ---------- planner ---------- */
.plan{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.plan{grid-template-columns:1fr}}
.target{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.target .nm{flex:1;font-weight:650;font-size:13.5px}
.target input{width:64px;text-align:center;padding:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim2);font-weight:800}
.stat .v{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v.good{color:var(--acc)}
.stat .v.bad{color:var(--bad)}
.stat .v.gold{color:var(--gold)}
.benchgroup{margin-bottom:16px}
.benchgroup h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.benchgroup h4 .step{width:22px;height:22px;border-radius:7px;background:rgba(34,211,238,.15);color:var(--acc2);display:grid;place-items:center;font-size:11px;font-weight:800}
.benchgroup h4 .loc{font-size:11.5px;color:var(--dim2);font-weight:500}

/* ---------- bench cards ---------- */
.benches{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bench .bbody{padding:15px}
.bench .bthumb{position:relative;aspect-ratio:16/9;background:rgba(0,0,0,.35);cursor:pointer}
.bench .bthumb img{width:100%;height:100%;object-fit:cover;display:block}
.bench .bthumb .count{
  position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:800;
  background:rgba(0,0,0,.65);border:1px solid var(--line2);padding:2px 7px;border-radius:999px;
}
.bench h3[data-viewbench]{cursor:pointer}
.bench h3[data-viewbench]:hover{text-decoration:underline}
.bench h3{margin:0 0 3px;font-size:16px;font-weight:750;display:flex;align-items:center;gap:8px}
.bench h3 .bdot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.bench .loc{font-size:12.5px;color:var(--acc2);margin-bottom:9px}
.bench .cnt{font-size:12px;color:var(--dim2)}
.bench .list{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.bench .list span{font-size:11.5px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.055);cursor:pointer}
.bench .list span:hover{background:rgba(255,255,255,.12)}

/* ---------- spots (drop offs / bus blocks) ---------- */
.spots{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-items:start}
.spot{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:.15s}
.spot:hover{border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.spot .thumb{position:relative;aspect-ratio:16/9;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:34px;opacity:.95}
.spot .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.spot .thumb .count{
  position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:800;
  background:rgba(0,0,0,.65);border:1px solid var(--line2);padding:2px 7px;border-radius:999px;
}
.spot .body{padding:12px 13px}
.spot .nm{font-weight:700;font-size:14.5px;margin-bottom:3px}
.spot .area{font-size:12.5px;color:var(--acc2);margin-bottom:5px}
.spot .blocks{font-size:12.5px;color:var(--warn);margin-bottom:5px}
.spot .tagrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:18px}
.shots img{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block}
.shotedit{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.shotedit .sh{position:relative;width:104px;height:68px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.shotedit .sh img{width:100%;height:100%;object-fit:cover;display:block}
.shotedit .sh button{
  position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:6px;border:none;
  background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:11px;line-height:1;padding:0;
}
.dropzone{
  border:1px dashed var(--line2);border-radius:12px;padding:20px;text-align:center;
  color:var(--dim2);cursor:pointer;transition:.15s;background:rgba(0,0,0,.14);
}
.dropzone:hover,.dropzone.over{border-color:rgba(74,222,128,.6);color:var(--txt);background:rgba(74,222,128,.06)}

.lightbox{
  position:fixed;inset:0;z-index:300;background:rgba(3,5,8,.93);
  display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out;
}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.lightbox .x{position:absolute;top:14px;right:20px;font-size:34px}

/* ---------- fab ---------- */
.fab{
  position:fixed;right:20px;bottom:22px;z-index:50;
  width:56px;height:56px;border-radius:18px;border:none;cursor:pointer;
  background:linear-gradient(140deg,var(--acc),#2fbf6b);color:#06120c;font-size:28px;font-weight:300;
  box-shadow:0 8px 26px rgba(74,222,128,.4);display:grid;place-items:center;
  transition:.15s;
}
.fab:hover{transform:scale(1.05)}
@media(max-width:700px){.fab{right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#182029;border:1px solid var(--line2);border-radius:12px;padding:11px 18px;
  z-index:200;opacity:0;pointer-events:none;transition:.22s;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.err{border-color:rgba(248,113,113,.5);color:#fecaca}

.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches button{
  width:32px;height:32px;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0;
  transition:.15s;
}
.swatches button:hover{transform:scale(1.08)}
.swatches button.on{border-color:var(--txt);box-shadow:0 0 0 2px rgba(0,0,0,.5) inset}
.swatches button.auto{
  width:auto;padding:0 12px;background:rgba(255,255,255,.06);color:var(--dim);
  font-size:12px;font-weight:700;border-color:var(--line);
}
.swatches button.auto.on{border-color:var(--txt);color:var(--txt)}

.hidden{display:none!important}
/* .fab sets display:grid, which would otherwise beat the browser's [hidden] rule */
[hidden]{display:none!important}

details.fold{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:rgba(0,0,0,.14)}
details.fold summary{cursor:pointer;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::before{content:"▸ ";color:var(--dim2)}
details.fold[open] summary::before{content:"▾ "}
details.fold summary:hover{color:var(--txt)}
details.fold summary .tiny{letter-spacing:0;text-transform:none;font-weight:500}

.switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0;font-size:14px}
.switch input{width:auto;margin:0}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="brand">
      <img class="mark" id="brandMark" alt="">
      <div>
        <span id="brandName">Street Manual</span>
        <small id="brandSub">crafting index</small>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="modePill"><span class="dot"></span><span id="modeTxt">loading…</span></span>
    <button class="btn sm ghost" id="btnLock" hidden></button>
    <button class="btn sm ghost" id="btnData">Data</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="wrap" id="view"></div>

<button class="fab" id="fab" title="Add item / recipe">+</button>
<div id="toast"></div>

<div class="overlay" id="overlay" hidden><div id="modalHost"></div></div>

<datalist id="dlItems"></datalist>
<datalist id="dlCraft"></datalist>
<datalist id="dlBp"></datalist>

<script>
/* =====================================================================
   CONFIG — edit these two blocks

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const norm = s => (s||"").trim().toLowerCase();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+"_"+Date.now().toString(36)+"_"+Math.floor(Math.random()*1e6).toString(36);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };

function money(n){
  if(n==null||!isFinite(n)) return "—";
  const neg = n<0; n = Math.abs(n);
  const s = n>=1000 ? Math.round(n).toLocaleString() : (Math.round(n*100)/100).toLocaleString();
  return (neg?"-$":"$")+s;
}
function dur(sec){
  if(sec==null||!isFinite(sec)||sec<=0) return "—";
  if(sec<60) return Math.round(sec)+"s";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  if(m<60) return s? m+"m "+s+"s" : m+"m";
  const h = Math.floor(m/60), mm = m%60;
  return mm? h+"h "+mm+"m" : h+"h";
}
function toast(msg,err){
  const t=$("#toast"); t.textContent=msg; t.className = err?"show err":"show";
  clearTimeout(t._t); t._t=setTimeout(()=>t.className="",2600);
}

function configured(){

function initCloud(){
  if(!configured() || !window.__fb) return false;
  try{

    db = FB.getFirestore(app);
    auth = FB.getAuth(app);

  }catch(err){ console.error("Firebase init failed", err); CLOUD = false; }
  return CLOUD;
}
const col = n => FB.collection(db, "boards", BOARD, n);
const ref = (n,id) => FB.doc(db, "boards", BOARD, n, id);

/* ---------------------------------------------------------------------
   Who can edit.
   On your own device (no Firebase) everything is editable — locking your
   own file would be pointless. In shared mode the manual opens read-only
   and you unlock it with the crew's edit code. The browser signs in
   anonymously so Firestore has a uid to hang the permission on, and the
   rules check that uid — so this is enforced on the server, not just
   hidden in the interface.
   --------------------------------------------------------------------- */
async function signIn(){
  if(!CLOUD) return null;
  const cred = await FB.signInAnonymously(auth);
  myUid = cred.user.uid;
  return myUid;
}
async function checkEditor(){
  if(!CLOUD){ S.canEdit = true; return true; }
  if(!myUid){ S.canEdit = false; return false; }
  try{
    const d = await FB.getDoc(FB.doc(db, "boards", BOARD, "editors", myUid));
    S.canEdit = d.exists();
  }catch(e){ S.canEdit = false; }
  return S.canEdit;
}
async function claimEditor(code){
  if(!CLOUD) return true;
  if(!myUid) throw new Error("not signed in yet — reload and try again");
  // The rules only let this write through when the code matches, so a wrong
  // code comes back as a permission error rather than a silent success.
  await FB.setDoc(FB.doc(db, "boards", BOARD, "editors", myUid), { code, at: Date.now() });
  S.canEdit = true;
  return true;
}

const Local = {
  read(k){ try{ return JSON.parse(localStorage.getItem(k)) || [] }catch(e){ return [] } },
  write(k,v){
    try{ localStorage.setItem(k, JSON.stringify(v)) }
    catch(e){ toast("This device is out of storage — remove some screenshots or switch to shared mode",1) }
  }
};
function localBytes(){
  let n = 0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(PFX)){ const v = localStorage.getItem(k); if(v) n += v.length; }
    }
  }catch(e){}
  return n;
}

// Firestore rejects undefined, so every field goes out with a real value.
function clean(o){
  const out = {};
  for(const k in o) out[k] = o[k]===undefined ? null : o[k];
  return out;
}

const Store = {
  async loadAll(){
    if(!CLOUD) return { items:Local.read(LK.items), benches:Local.read(LK.benches), spots:Local.read(LK.spots) };
    const [i,b,s] = await Promise.all([
      FB.getDocs(col("items")), FB.getDocs(col("benches")), FB.getDocs(col("spots"))
    ]);
    const rows = snap => snap.docs.map(d=>({ ...d.data(), id:d.id }));
    return { items:rows(i), benches:rows(b), spots:rows(s) };
  },

  async saveItem(it){ return this._save("items", LK.items, it); },
  async saveBench(b){ return this._save("benches", LK.benches, b); },
  async saveSpot(sp){ return this._save("spots", LK.spots, sp); },
  async delItem(id){ return this._del("items", LK.items, id); },
  async delBench(id){ return this._del("benches", LK.benches, id); },
  async delSpot(id){ return this._del("spots", LK.spots, id); },

  async _save(name, key, rec){
    if(!CLOUD){
      const all = Local.read(key);
      const i = all.findIndex(x=>x.id===rec.id);
      if(i>=0) all[i]=rec; else all.push(rec);
      Local.write(key, all); return rec;
    }
    await FB.setDoc(ref(name, rec.id), clean({...rec, updatedAt: Date.now()}));
    return rec;
  },
  async _del(name, key, id){
    if(!CLOUD){ Local.write(key, Local.read(key).filter(x=>x.id!==id)); return }
    await FB.deleteDoc(ref(name, id));
  },

  async replaceAll(items, benches, spots){
    spots = spots||[];
    imgCache.clear();
    if(!CLOUD){
      Local.write(LK.items,items); Local.write(LK.benches,benches); Local.write(LK.spots,spots);
      try{
        const dead = [];
        for(let i=0;i<localStorage.length;i++){
          const k = localStorage.key(i);
          if(k && k.startsWith(PFX+"img:")) dead.push(k);
        }
        dead.forEach(k=>localStorage.removeItem(k));
      }catch(e){}
      return;
    }
    for(const name of ["items","benches","spots","images"]){
      const snap = await FB.getDocs(col(name));
      await commitAll(snap.docs.map(d=>({op:"del", ref:d.ref})));
    }
    await commitAll([
      ...benches.map(b=>({op:"set", ref:ref("benches",b.id), data:clean(b)})),
      ...items.map(  i=>({op:"set", ref:ref("items",i.id),   data:clean(i)})),
      ...spots.map(  s=>({op:"set", ref:ref("spots",s.id),   data:clean(s)}))
    ]);
  },

  subscribe(cb){
    if(!CLOUD) return;
    for(const name of ["items","benches","spots"]){
      let seeded = false;   // each collection's first snapshot is the load, not a change
      FB.onSnapshot(col(name), ()=>{ if(!seeded){ seeded = true; return; } cb(); },
        err=>console.warn("live sync ("+name+"):", err.message));
    }
  }
};

// Firestore batches cap at 500 writes.
async function commitAll(ops){
  for(let i=0;i<ops.length;i+=450){
    const batch = FB.writeBatch(db);
    for(const o of ops.slice(i,i+450)){
      if(o.op==="del") batch.delete(o.ref); else batch.set(o.ref, o.data);
    }
    await batch.commit();
  }
}

/* ---------------------------------------------------------------------
   Screenshots.
   A spot record carries only a small thumbnail; the full-size image lives
   in its own record and is fetched when you actually open the spot. That
   keeps the tab listing cheap no matter how many pictures pile up.
   --------------------------------------------------------------------- */
const imgCache = new Map();

async function putImage(dataUrl){
  const id = uid("img");
  if(CLOUD) await FB.setDoc(ref("images", id), { data:dataUrl, at:Date.now() });
  else localStorage.setItem(IMGK(id), dataUrl);
  imgCache.set(id, dataUrl);
  return id;
}
async function getImage(id){
  if(imgCache.has(id)) return imgCache.get(id);
  let v = "";
  try{
    if(CLOUD){ const d = await FB.getDoc(ref("images", id)); v = d.exists()? (d.data().data||"") : ""; }
    else v = localStorage.getItem(IMGK(id)) || "";
  }catch(e){ console.warn("image load failed", e.message); }
  imgCache.set(id, v);
  return v;
}
async function dropImage(id){
  imgCache.delete(id);
  try{
    if(CLOUD) await FB.deleteDoc(ref("images", id));
    else localStorage.removeItem(IMGK(id));
  }catch(e){}
}

// An image entry is {src:"https://…"} for a link, {id, thumb} for an upload.
// Plain strings are the original format and still work.
const imgThumb = e => !e ? "" : (typeof e==="string" ? e : (e.thumb || e.src || ""));
const imgId    = e => (e && typeof e==="object" && e.id) ? e.id : null;
async function imgFull(e){
  if(!e) return "";
  if(typeof e==="string") return e;
  if(e.src) return e.src;
  if(e.id)  return (await getImage(e.id)) || e.thumb || "";
  return e.thumb || "";
}

const isBlueprint = it => !!(it && it.blueprint);
const bpsOf = it => (it && it.blueprints) || [];
// A blueprint you keep is owned or not; one that burns is counted like anything
// else. Both ride on the same per-device on-hand numbers.
const ownsBp = name => (S.stock[norm(name)]||0) > 0;
const benchName = id => (S.benches.find(b=>b.id===id)||{}).name || "";
const benchOf   = id => S.benches.find(b=>b.id===id) || null;

/* Each bench gets its own colour so you can spot at a glance which one an item
   belongs to. Eight hues in a fixed order — checked for colour-blind separation
   and contrast against this background rather than picked by eye. The bench name
   is always written in the tag too, so colour is a shortcut, never the only clue. */
const BENCH_HUES = ["#3987e5","#d95926","#199e70","#c98500",
                    "#d55181","#008300","#9085e9","#e66767"];
function hexA(h,a){
  const n = parseInt(h.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function benchColor(id){
  const b = benchOf(id);
  if(!b) return null;
  if(b.color) return b.color;                       // picked by hand
  const order = S.benches.map(x=>x.id).sort();      // stable, so colours don't shuffle
  const i = order.indexOf(b.id);
  return BENCH_HUES[(i<0?0:i) % BENCH_HUES.length];
}
function benchTagStyle(id){
  const c = benchColor(id);
  return c ? `background:${hexA(c,.15)};color:${c};border:1px solid ${hexA(c,.42)}` : "";
}

/* =====================================================================
   THE ENGINE — recursive raw-material rollup
   ---------------------------------------------------------------------
   Walks a recipe down through every sub-craft, honours output quantities
   (a recipe that yields 5 only needs to run twice for 9), guards against
   recipe loops, and can consume what you already have on hand.
   ===================================================================== */
function rollup(rootName, qty, opts){
  opts = opts || {};
  const useStock = !!opts.useStock;
  const avail = new Map();
  if(useStock) for(const k in S.stock){ if(S.stock[k]>0) avail.set(k, S.stock[k]); }

  const raw     = new Map();  // key -> {name, qty, item}
  const steps   = new Map();  // key -> {item, crafts, depth}
  const fromHave= new Map();  // key -> qty pulled from stock
  const bps     = new Map();  // key -> {name, item, qty, unlock}
  const unknown = new Set();
  let loop = false;

  function addBp(name, q, unlock, item){
    const key = norm(name);
    const e = bps.get(key) || { name:(item&&item.name)||name, item:item||null, qty:0, unlock:!!unlock };
    if(unlock){ e.unlock = true; e.qty = Math.max(e.qty, 1); }   // one is one, however many you make
    else e.qty += q;
    bps.set(key, e);
  }

  function takeStock(key, need){
    if(!useStock) return need;
    const a = avail.get(key)||0;
    if(a<=0) return need;
    const used = Math.min(a, need);
    avail.set(key, a-used);
    fromHave.set(key, (fromHave.get(key)||0)+used);
    return need-used;
  }
  function addRaw(key, name, q, item){
    if(q<=0) return;
    const e = raw.get(key) || {name, qty:0, item:item||null};
    e.qty += q; raw.set(key, e);
  }
  function walk(name, need, depth, path){
    const key = norm(name);
    need = takeStock(key, need);
    if(need<=0) return;

    const it = S.byName.get(key);
    if(!it){ unknown.add(name); addRaw(key, name, need, null); return; }
    // a blueprint isn't something you buy at the hardware store — own bucket
    if(isBlueprint(it)){ addBp(it.name, need, false, it); return; }
    if(!isCraftable(it)){ addRaw(key, it.name, need, it); return; }
    if(path.has(key)){ loop = true; addRaw(key, it.name, need, it); return; }
    if(depth > 24){ loop = true; addRaw(key, it.name, need, it); return; }

    const per    = Math.max(1, it.outputQty||1);
    const crafts = Math.ceil(need/per);
    const s = steps.get(key) || { item:it, crafts:0, depth:0 };
    s.crafts += crafts;
    s.depth   = Math.max(s.depth, depth);
    steps.set(key, s);

    // blueprints this recipe needs — only once we know we're actually crafting it
    for(const bp of bpsOf(it)){
      if(!bp.name) continue;
      if(bp.consumed) walk(bp.name, (num(bp.qty)||1) * crafts, depth+1, new Set(path));
      else addBp(bp.name, 1, true, S.byName.get(norm(bp.name)));
    }

    const p2 = new Set(path); p2.add(key);
    for(const ing of it.ingredients){
      const q = (num(ing.qty)||0) * crafts;
      if(q>0) walk(ing.name, q, depth+1, p2);
    }
  }

  walk(rootName, qty, 0, new Set());

  // costs — consumed blueprints are a real spend, unlocks are a one-off you own
  let cost = 0, missingCost = 0;
  for(const [k,e] of raw){
    const c = e.item ? num(e.item.buyCost) : null;
    if(c==null) missingCost++; else cost += c*e.qty;
  }
  for(const [k,e] of bps){
    if(e.unlock) continue;
    const c = e.item ? num(e.item.buyCost) : null;
    if(c==null) missingCost++; else cost += c*e.qty;
  }
  let time = 0, missingTime = 0;
  for(const [k,s] of steps){
    const t = num(s.item.craftTime);
    if(t==null) missingTime++; else time += t*s.crafts;
  }

  return {
    raw:[...raw.values()].sort((a,b)=>a.name.localeCompare(b.name)),
    steps:[...steps.values()].sort((a,b)=> b.depth-a.depth || a.item.name.localeCompare(b.item.name)),
    blueprints:[...bps.values()].sort((a,b)=>a.name.localeCompare(b.name)),
    fromHave, unknown:[...unknown], loop, cost, missingCost, time, missingTime
  };
}

// Roll up several targets at once (the planner).
function rollupMany(targets, opts){
  const merged = { raw:new Map(), steps:new Map(), fromHave:new Map(), unknown:new Set(), loop:false, cost:0, missingCost:0, time:0, missingTime:0 };
  // Do it as one walk so shared sub-components and stock are pooled correctly.
  const fake = { name:"__plan__", outputQty:1, craftTime:0, blueprints:[],
                 ingredients: targets.map(t=>({name:t.name, qty:t.qty})) };
  S.byName.set("__plan__", fake);
  const r = rollup("__plan__", 1, opts);
  S.byName.delete("__plan__");
  // Drop the synthetic root from the step list.
  r.steps = r.steps.filter(s=>s.item.name!=="__plan__");
  return r;
}

function itemEconomics(it){
  if(!isCraftable(it)) return null;
  const r = rollup(it.name, Math.max(1,it.outputQty||1), {useStock:false});
  const sell = num(it.sellPrice);
  const revenue = sell==null? null : sell*Math.max(1,it.outputQty||1);
  const profit  = (revenue==null || r.missingCost>0) ? null : revenue - r.cost;
  return { ...r, revenue, profit };
}

// "Needs attention" means the app will give you a wrong or incomplete answer —
// not that an optional note is blank. A raw material with no source written
// down still works perfectly everywhere, so it isn't flagged.
function gapsOf(it){
  const g = [];
  if(isCraftable(it)){
    if(!it.benchId) g.push("no bench");                       // breaks the bench route
    if(num(it.craftTime)==null) g.push("no craft time");      // breaks time totals
    if(S.money && num(it.sellPrice)==null) g.push("no sell price");
    // an ingredient that doesn't exist can't be costed or broken down
    for(const ing of it.ingredients){ if(!S.byName.get(norm(ing.name))) g.push("unknown: "+ing.name); }
    for(const bp of bpsOf(it)){ if(bp.name && !S.byName.get(norm(bp.name))) g.push("unknown blueprint: "+bp.name); }
  }else{
    if(S.money && num(it.buyCost)==null) g.push("no cost");   // breaks cost totals
  }
  return g;
}

// Not a problem, just untidy — its own quiet filter, no badge on the card.
const noSource = it => !isCraftable(it) && !it.source;

/* =====================================================================
   MODALS
   ===================================================================== */
function openModal(html, cls){
  const h = $("#modalHost");
  // a modal replacing another must not leave the old paste handler bound
  if(h._paste){ document.removeEventListener("paste", h._paste); h._paste = null; }
  h.innerHTML = '<div class="modal '+(cls||"")+'">'+html+'</div>';
  $("#overlay").hidden = false;
  document.body.style.overflow="hidden";
}
function closeModal(){
  const h = $("#modalHost");
  if(h._paste){ document.removeEventListener("paste", h._paste); h._paste = null; }
  $("#overlay").hidden = true;
  h.innerHTML = "";
  document.body.style.overflow="";
}
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
// a quantity only means anything for a blueprint that gets used up
document.addEventListener("change", e=>{
  const sel = e.target.closest(".bp-c");
  if(!sel) return;
  const q = sel.parentElement.querySelector(".bp-q");
  if(q) q.disabled = sel.value !== "1";
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    const lb = $(".lightbox");
    if(lb){ lb.remove(); return; }
    if(!$("#overlay").hidden) closeModal();
  }
  if(e.key==="/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    const s=$("#q"); if(s){ e.preventDefault(); s.focus(); }
  }
});

/* =====================================================================
   VIEW: CATALOGUE
   ===================================================================== */
function categories(){
  return [...new Set(S.items.map(i=>i.category).filter(Boolean))].sort();
}
function filtered(){
  const q = norm(S.q);
  return S.items.filter(it=>{
    if(S.fBench && it.benchId!==S.fBench) return false;
    if(S.fCat && it.category!==S.fCat) return false;
    if(S.fFlag==="craft" && !isCraftable(it)) return false;
    if(S.fFlag==="raw" && (isCraftable(it) || isBlueprint(it))) return false;
    if(S.fFlag==="bp" && !isBlueprint(it)) return false;
    if(S.fFlag==="gaps" && gapsOf(it).length===0) return false;
    if(S.fFlag==="nosrc" && !noSource(it)) return false;
    if(!q) return true;
    if(norm(it.name).includes(q)) return true;
    if(norm(it.category).includes(q)) return true;
    if(norm(benchName(it.benchId)).includes(q)) return true;
    return (it.ingredients||[]).some(g=>norm(g.name).includes(q));
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

function viewCatalogue(){
  const cats = categories();
  const list = filtered();
  const gapCount = S.items.filter(i=>gapsOf(i).length).length;
  const srcCount = S.items.filter(noSource).length;

  return `
  <div class="toolbar">
    <div class="search">
      <span class="ico">⌕</span>
      <input id="q" placeholder="Search items, ingredients, benches…  ( / )" value="${esc(S.q)}">
    </div>
    <select id="fBench" style="width:auto;min-width:150px">
      <option value="">All benches</option>
      ${S.benches.map(b=>`<option value="${b.id}" ${S.fBench===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}
    </select>
  </div>
  <div class="chips" style="margin:-6px 0 16px">
    <button class="chip ${S.fFlag===""?"on":""}" data-flag="">Everything <span class="tiny">${S.items.length}</span></button>
    <button class="chip ${S.fFlag==="craft"?"on":""}" data-flag="craft">Craftable</button>
    <button class="chip ${S.fFlag==="raw"?"on":""}" data-flag="raw">Materials</button>
    ${S.items.some(isBlueprint)? `<button class="chip ${S.fFlag==="bp"?"on":""}" data-flag="bp">Blueprints <span class="tiny">${S.items.filter(isBlueprint).length}</span></button>`:""}
    ${gapCount? `<button class="chip warnchip ${S.fFlag==="gaps"?"on":""}" data-flag="gaps">Needs attention <span class="tiny">${gapCount}</span></button>`:""}
    ${srcCount? `<button class="chip ${S.fFlag==="nosrc"?"on":""}" data-flag="nosrc">No source yet <span class="tiny">${srcCount}</span></button>`:""}
    ${cats.map(c=>`<button class="chip ${S.fCat===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}
  </div>
  ${ list.length ? `<div class="items">${list.map(itemCard).join("")}</div>`
    : `<div class="empty"><div class="big">⚒</div>
        <div style="font-weight:700;color:var(--dim);margin-bottom:6px">${S.items.length? "Nothing matches that." : "Nothing in here yet."}</div>
        <div class="tiny">${S.items.length? "Try clearing the filters." : (S.canEdit? "Hit the + button to add your first recipe. Ingredients you name get created automatically." : "Nothing has been added yet.")}</div>
      </div>` }`;
}

function itemCard(it){
  const craft = isCraftable(it);
  const gaps  = gapsOf(it);
  let badge = "";
  if(isBlueprint(it)) badge = `<span class="badge bp">BLUEPRINT</span>`;
  else if(!craft) badge = `<span class="badge raw">MATERIAL</span>`;
  else{
    if(S.money){
      const e = itemEconomics(it);
      if(e && e.profit!=null) badge = `<span class="badge ${e.profit>=0?"prof":"loss"}">${e.profit>=0?"+":""}${money(e.profit)}</span>`;
    }
    if(!badge && gaps.length) badge = `<span class="badge gap">${gaps.length} gap${gaps.length>1?"s":""}</span>`;
  }
  const ings = craft
    ? `<div class="ing">${it.ingredients.slice(0,6).map(g=>`<b>${esc(String(g.qty??"?"))}×</b> ${esc(g.name)}`).join(" · ")}${it.ingredients.length>6?` <span class="muted">+${it.ingredients.length-6} more</span>`:""}</div>`
    : (()=>{
        // nothing to say about a bare material — an empty line reads better than
        // "source not set" nagging from every card
        const bits = [];
        if(it.source) bits.push(esc(it.source));
        if(S.money && num(it.buyCost)!=null) bits.push(money(it.buyCost)+" ea");
        return bits.length? `<div class="ing muted">${bits.join(" · ")}</div>` : "";
      })();
  return `<div class="item" data-id="${it.id}">
    ${badge}
    <div class="nm">${esc(it.name)}${(it.outputQty||1)>1?` <span class="muted tiny">×${it.outputQty}</span>`:""}</div>
    <div class="sub">
      ${it.benchId? `<span class="tag tbench" style="${benchTagStyle(it.benchId)}">${esc(benchName(it.benchId))}</span>`:""}
      ${it.category? `<span class="tag">${esc(it.category)}</span>`:""}
      ${num(it.craftTime)!=null? `<span class="tag">${dur(it.craftTime)}</span>`:""}
      ${it.levelReq? `<span class="tag">lvl ${esc(it.levelReq)}</span>`:""}
      ${bpsOf(it).length? `<span class="tag tbp">◆ blueprint${bpsOf(it).length>1?"s":""}</span>`:""}
    </div>
    ${ings}
  </div>`;
}

/* =====================================================================
   VIEW: BENCHES
   ===================================================================== */
function viewBenches(){
  if(!S.benches.length) return `<div class="empty"><div class="big">🏭</div>
    <div style="font-weight:700;color:var(--dim);margin-bottom:6px">No benches yet.</div>
    <div class="tiny" style="margin-bottom:16px">Add every crafting bench in the city — then each recipe gets tagged to one.</div>
    ${S.canEdit? `<button class="btn primary" id="addBench1">Add a bench</button>`:""}</div>`;

  const unassigned = S.items.filter(i=>isCraftable(i) && !i.benchId);
  return `
  <div class="toolbar" style="justify-content:space-between">
    <div class="sec-title" style="margin:0">${S.benches.length} bench${S.benches.length>1?"es":""}</div>
    ${S.canEdit? `<button class="btn sm" id="addBench1">+ Add bench</button>`:""}
  </div>
  <div class="benches">
    ${S.benches.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>{
      const mine = S.items.filter(i=>i.benchId===b.id).sort((x,y)=>x.name.localeCompare(y.name));
      const c = benchColor(b.id);
      const cover = imgThumb((b.images||[])[0]);
      return `<div class="bench" style="border-left:3px solid ${c}">
        ${cover? `<div class="bthumb" data-viewbench="${b.id}"><img src="${esc(cover)}" alt="" loading="lazy">
          ${(b.images||[]).length>1? `<span class="count">${b.images.length}</span>`:""}</div>`:""}
        <div class="bbody">
          <h3 data-viewbench="${b.id}"><span class="bdot" style="background:${c}"></span>${esc(b.name)}</h3>
          <div class="loc">${b.location? esc(b.location) : "<span class='muted'>location not set</span>"}</div>
          <div class="cnt">${mine.length} recipe${mine.length===1?"":"s"}${(b.images||[]).length&&!cover?" · has photos":""}</div>
          ${b.notes? `<div class="tiny muted" style="margin-top:7px">${esc(b.notes)}</div>`:""}
          <div class="list">${mine.slice(0,14).map(i=>`<span data-id="${i.id}">${esc(i.name)}</span>`).join("")}
            ${mine.length>14?`<span class="muted">+${mine.length-14}</span>`:""}</div>
          <div style="margin-top:12px;display:flex;gap:8px">
            <button class="btn sm ghost" data-viewbench="${b.id}">${(b.images||[]).length? "Photos":"Details"}</button>
            ${S.canEdit? `<button class="btn sm ghost" data-editbench="${b.id}">Edit</button>`:""}
          </div>
        </div>
      </div>`;
    }).join("")}
  </div>
  ${unassigned.length? `<div class="card" style="margin-top:16px;border-color:rgba(251,191,36,.3)">

    <div class="list" style="margin:0">${unassigned.map(i=>`<span data-id="${i.id}">${esc(i.name)}</span>`).join("")}</div>
  </div>`:""}`;
}

/* =====================================================================
   VIEW: PLANNER
   ===================================================================== */
function viewPlanner(){
  const r = S.targets.length ? rollupMany(S.targets,{useStock:S.useStock}) : null;

  const left = `<div class="card">
    <div class="sec-title">What are you making?</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="planAdd" list="dlCraft" placeholder="What are you crafting?" style="flex:1">
      <input id="planQty" type="number" min="1" value="1" style="width:70px;text-align:center">
      <button class="btn primary" id="planAddBtn">Add</button>
    </div>
    ${S.targets.length? S.targets.map((t,i)=>`
      <div class="target">
        <span class="nm">${esc(t.name)}</span>
        <input type="number" min="1" value="${t.qty}" data-tq="${i}">
        <button class="btn sm ghost" data-trm="${i}">✕</button>
      </div>`).join("") : `<div class="tiny muted">Add a few items and you'll get one combined materials list.</div>`}
    ${S.targets.length? `<button class="btn sm ghost" id="planClear" style="margin-top:12px">Clear all</button>`:""}
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="useStock" ${S.useStock?"checked":""} style="width:auto">
      Subtract what I already have
    </label>
  </div>`;

  if(!r) return `<div class="plan">${left}<div class="empty"><div class="big">📋</div>
    <div style="font-weight:700;color:var(--dim)">Nothing planned yet.</div>
    <div class="tiny">Pick your items on the left.</div></div></div>`;

  // Raw materials still needed, plus any that your stock already covers
  // (kept visible so you can correct the count without hunting for it).
  const shop = r.raw.filter(x=>x.qty>0);
  for(const [k,v] of r.fromHave){
    const it = S.byName.get(k);
    if(isCraftable(it)) continue;                       // covered sub-craft, not a shopping row
    if(shop.some(x=>norm(x.name)===k)) continue;
    shop.push({ name:(it&&it.name)||k, qty:0, item:it||null });
  }
  shop.sort((a,b)=> (b.qty>0)-(a.qty>0) || a.name.localeCompare(b.name));
  const groups = {};
  for(const s of r.steps){
    const k = s.item.benchId || "__none__";
    (groups[k] = groups[k] || {depth:-1, steps:[]});
    groups[k].steps.push(s);
    groups[k].depth = Math.max(groups[k].depth, s.depth);
  }
  const order = Object.keys(groups).sort((a,b)=>groups[b].depth-groups[a].depth);

  const right = `
    <div>
      <div class="stats">
        <div class="stat"><div class="k">Materials to get</div><div class="v">${shop.filter(x=>x.qty>0).length}</div></div>
        <div class="stat"><div class="k">Crafts to run</div><div class="v">${r.steps.reduce((a,s)=>a+s.crafts,0)}</div></div>
        ${r.blueprints.length? `<div class="stat"><div class="k">Blueprints</div>
          <div class="v ${r.blueprints.every(bp=>ownsBp(bp.name))?"good":"bad"}">${r.blueprints.filter(bp=>ownsBp(bp.name)).length}/${r.blueprints.length}</div>
          <div class="tiny muted">you own</div></div>`:""}
        ${S.money? `<div class="stat"><div class="k">Est. cost</div><div class="v gold">${r.missingCost? "—" : money(r.cost)}</div>
          ${r.missingCost?`<div class="tiny muted">${r.missingCost} missing price${r.missingCost>1?"s":""}</div>`:""}</div>`:""}
        <div class="stat"><div class="k">Craft time</div><div class="v">${r.missingTime? "—" : dur(r.time)}</div>
          ${r.missingTime?`<div class="tiny muted">${r.missingTime} missing</div>`:""}</div>
      </div>

      ${r.unknown.length? `<div class="card" style="border-color:rgba(251,191,36,.35);margin-bottom:16px">
        <div class="sec-title" style="color:var(--warn)">Not in the manual yet</div>
        <div class="tiny">${r.unknown.map(esc).join(", ")} — treated as raw materials. Add them to price them properly.</div>
      </div>`:""}
      ${r.loop? `<div class="card" style="border-color:rgba(248,113,113,.35);margin-bottom:16px">
        <div class="sec-title" style="color:var(--bad)">Recipe loop detected</div>
        <div class="tiny">Something references itself down the chain. It's been treated as raw so the maths still works.</div>
      </div>`:""}

      ${r.blueprints.length? `<div class="card" style="margin-bottom:16px">
        <div class="sec-title">Blueprints needed</div>
        <div class="tscroll"><table>
          <thead><tr><th>Blueprint</th><th class="num">Need</th><th>Type</th><th class="num">Got it</th><th>Where from</th></tr></thead>
          <tbody>${r.blueprints.map(bp=>{
            const have = ownsBp(bp.name);
            return `<tr>
              <td>${esc(bp.name)}${bp.item?"":' <span class="tag" style="color:var(--warn)">new</span>'}</td>
              <td class="num mono" style="font-weight:700">${bp.unlock? "1" : bp.qty}</td>
              <td class="tiny muted">${bp.unlock? "unlock — keep it" : "used up each craft"}</td>
              <td class="num"><input type="checkbox" data-ownbp="${esc(bp.name)}" ${have?"checked":""} style="width:auto"></td>
              <td class="tiny muted">${bp.item&&bp.item.source? esc(bp.item.source):"—"}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        ${r.blueprints.some(bp=>!ownsBp(bp.name))

const KIND = {
  dropoff:  { label:"Drop Offs",  one:"drop off",  icon:"🚗",
              blurb:"Where you ditch the hot car or swap into a clean one.",
              nameHint:"e.g. Vespucci parking garage, level 3" },
  busblock: { label:"Bus Blocks", one:"bus block", icon:"🚌",
              blurb:"Spots to park something big and choke the road behind you.",
              nameHint:"e.g. Tunnel mouth under Olympic" }
};
const spotsOf = k => S.spots.filter(s=>s.kind===k);
const tagsOf  = k => [...new Set(spotsOf(k).flatMap(s=>s.tags||[]))].sort();

function viewSpots(kind){
  const K = KIND[kind];
  const q = norm(S.spotQ);
  let list = spotsOf(kind);
  if(S.spotTag) list = list.filter(s=>(s.tags||[]).includes(S.spotTag));
  if(q) list = list.filter(s =>
    norm(s.name).includes(q) || norm(s.area).includes(q) ||
    norm(s.notes).includes(q) || norm(s.blocks).includes(q) ||
    (s.tags||[]).some(t=>norm(t).includes(q)));
  list = list.slice().sort((a,b)=> (a.area||"~").localeCompare(b.area||"~") || a.name.localeCompare(b.name));

  const tags = tagsOf(kind);
  if(!spotsOf(kind).length) return `<div class="empty"><div class="big">${K.icon}</div>
    <div style="font-weight:700;color:var(--dim);margin-bottom:6px">No ${K.label.toLowerCase()} saved yet.</div>
    <div class="tiny" style="margin-bottom:16px">${K.blurb}</div>
    ${S.canEdit? `<button class="btn primary" data-newspot="${kind}">Add a ${K.one}</button>`:""}</div>`;

  return `
  <div class="toolbar">
    <div class="search">
      <span class="ico">⌕</span>
      <input id="sq" placeholder="Search ${K.label.toLowerCase()}…" value="${esc(S.spotQ)}">
    </div>
    ${S.canEdit? `<button class="btn sm" data-newspot="${kind}">+ Add ${K.one}</button>`:""}
  </div>
  ${tags.length? `<div class="chips" style="margin:-6px 0 16px">
    <button class="chip ${S.spotTag===""?"on":""}" data-stag="">All <span class="tiny">${spotsOf(kind).length}</span></button>
    ${tags.map(t=>`<button class="chip ${S.spotTag===t?"on":""}" data-stag="${esc(t)}">${esc(t)}</button>`).join("")}
  </div>`:""}
  ${list.length? `<div class="spots">${list.map(spotCard).join("")}</div>`
   : `<div class="empty"><div class="tiny">Nothing matches that.</div></div>`}`;
}

/* ---------------------------------------------------------------------
   The screenshot picker, shared by spots and benches: click, drag, paste,
   or add a link. Uploads are deferred until save so cancelling never
   leaves orphaned images behind.
   --------------------------------------------------------------------- */
function shotEditorHTML(label){
  return `
      <div class="sec-title" style="margin-top:18px">${label||"Screenshots"}</div>
      <div class="dropzone" id="dz">
        <div class="tiny">Click to pick a file, drag one in, or just paste (Ctrl/⌘ V)</div>
        <input type="file" id="s_file" accept="image/*" multiple class="hidden">
      </div>
      <div style="display:flex;gap:8px;margin:8px 0 0">
        <input id="s_url" placeholder="…or paste an image link (Discord, imgur)" style="flex:1">
        <button class="btn sm" id="addUrl">Add</button>
      </div>
      <div class="shotedit" id="shots"></div>
      <div class="tiny muted" id="shotInfo" style="margin-top:6px"></div>`;
}

function mountShotEditor(initial){
  let shots = (initial||[]).slice();

  function paint(){
    $("#shots").innerHTML = shots.map((e,i)=>
      `<div class="sh"><img src="${esc(imgThumb(e))}" alt=""><button type="button" data-rm="${i}">✕</button></div>`).join("");
    $$("#shots [data-rm]").forEach(b=> b.onclick = ()=>{ shots.splice(+b.dataset.rm,1); paint(); });
    const bytes = shots.reduce((a,e)=> a + ((e && e._full)? e._full.length*0.75 : 0), 0);
    const links = shots.filter(e=>e && e.src).length;
    $("#shotInfo").textContent = shots.length
      ? `${shots.length} image${shots.length>1?"s":""}`
        + (links? ` · ${links} link${links>1?"s":""}`:"")
        + (bytes? ` · about ${Math.round(bytes/1024)} KB to upload`:"")
      : "";
  }
  paint();

  async function addFiles(files){
    for(const f of files){
      if(!f || !f.type.startsWith("image/")) continue;
      if(shots.length>=8){ toast("8 images is the limit",1); break; }
      try{
        const {full, thumb} = await prepShot(f);
        shots.push({ thumb, _full:full });
      }catch(e){ toast("Couldn't read that image",1); }
    }
    paint();
  }

  const dz = $("#dz");
  dz.onclick = ()=>$("#s_file").click();
  $("#s_file").onchange = e=>addFiles([...e.target.files]);
  dz.ondragover = e=>{ e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = ()=>dz.classList.remove("over");
  dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove("over"); addFiles([...e.dataTransfer.files]); };
  $("#addUrl").onclick = ()=>{
    const u = $("#s_url").value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) return toast("That doesn't look like a link",1);
    shots.push({ src:u }); $("#s_url").value=""; paint();
  };
  $("#modalHost")._paste = e=>{
    const files = [...(e.clipboardData&&e.clipboardData.files||[])];
    if(files.length){ e.preventDefault(); addFiles(files); }
  };
  document.addEventListener("paste", $("#modalHost")._paste);

  return {
    // uploads the new ones, then deletes any that were taken off this record
    async commit(previous){
      const out = [];
      for(const e of shots){
        if(e && e._full) out.push({ id: await putImage(e._full), thumb: e.thumb });
        else out.push(e);
      }
      const kept = new Set(out.map(imgId).filter(Boolean));
      for(const old of (previous||[])){
        const id = imgId(old);
        if(id && !kept.has(id)) await dropImage(id);
      }
      return out;
    }
  };
}

// A gallery that shows thumbnails immediately and swaps the full-size images
// in behind them once they've loaded.
function galleryHTML(images, key){
  if(!(images||[]).length) return "";
  return `<div class="shots">${images.map((e,i)=>
    `<img src="${esc(imgThumb(e))}" alt="" data-shot="${i}" data-spotid="${esc(key)}">`).join("")}</div>`;
}
function hydrateGallery(images, key){
  (images||[]).forEach(async (e,i)=>{
    const full = await imgFull(e);
    const el = $(`[data-shot="${i}"][data-spotid="${key}"]`);
    if(el && full && el.src !== full) el.src = full;
  });
}

// Screenshots get downscaled before storing. You only need to recognise the
// spot, a raw 4K grab would eat the storage budget on its own, and a Firestore
// record caps out at 1 MB — so the full size is stepped down until it fits
// comfortably, and a small thumbnail is kept alongside it for the listings.
function fileToUrl(f){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = rej; fr.onload = ()=>res(fr.result); fr.readAsDataURL(f);
  });
}
function loadImgEl(src){
  return new Promise((res,rej)=>{
    const i = new Image();
    i.onerror = rej; i.onload = ()=>res(i); i.src = src;
  });
}
function draw(img, max, q){
  const sc = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width*sc));
  c.height = Math.max(1, Math.round(img.height*sc));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function prepShot(file){
  const img = await loadImgEl(await fileToUrl(file));
  let full = draw(img, 1400, .72);
  for(const [max,q] of [[1400,.62],[1150,.58],[950,.52],[750,.45]]){
    if(full.length <= 700000) break;
    full = draw(img, max, q);
  }
  return { full, thumb: draw(img, 420, .58) };
}

async function saveItemForm(existing){
  const name = $("#e_name").value.trim();
  if(!name) return toast("Give it a name",1);

  const ings = $$("#ingList .ingrow").map(r=>({
    name: r.querySelector(".ing-n").value.trim(),
    qty:  num(r.querySelector(".ing-q").value) || 0
  })).filter(g=>g.name);

  const bps = $$("#bpList .bprow").map(r=>{
    const consumed = r.querySelector(".bp-c").value === "1";
    return { name: r.querySelector(".bp-n").value.trim(),
             consumed,
             qty: consumed ? Math.max(1, parseInt(r.querySelector(".bp-q").value)||1) : 1 };
  }).filter(g=>g.name);

  const dupe = S.items.find(x=>norm(x.name)===norm(name) && x.id!==(existing&&existing.id));
  if(dupe) return toast("Something's already called that",1);

  const it = {
    id: existing? existing.id : uid("it"),
    name, category:$("#e_cat").value.trim(), benchId:$("#e_bench").value,
    outputQty: Math.max(1, parseInt($("#e_out").value)||1),
    craftTime: num($("#e_time").value), levelReq:$("#e_lvl").value.trim(), xp:num($("#e_xp").value),
    buyCost: num($("#e_buy").value), sellPrice: num($("#e_sell").value),
    source: $("#e_src").value.trim(), notes: $("#e_notes").value.trim(),
    ingredients: ings, blueprints: bps,
    blueprint: !!(existing && existing.blueprint)
  };

  try{
    const saved = await Store.saveItem(it);
    upsertLocal(saved);

    // anything named that doesn't exist yet gets created — ingredients as raw
    // materials, blueprints flagged as blueprints so they sort correctly
    let created = 0;
    const stub = (nm, isBp) => ({
      id:uid("it"), name:nm.trim(), category: isBp? "Blueprint":"", benchId:"", outputQty:1,
      craftTime:null, levelReq:"", xp:null, buyCost:null, sellPrice:null,
      source:"", notes:"", ingredients:[], blueprints:[], blueprint: !!isBp
    });
    for(const g of ings){
      if(S.byName.get(norm(g.name))) continue;
      upsertLocal(await Store.saveItem(stub(g.name, false))); created++;
    }
    for(const g of bps){
      if(S.byName.get(norm(g.name))) continue;
      upsertLocal(await Store.saveItem(stub(g.name, true))); created++;
    }
    closeModal(); render();
    toast(created? `Saved — ${created} new entr${created>1?"ies":"y"} added` : "Saved");
  }catch(err){ console.error(err); toast("Save failed: "+(err.message||err),1); }
}
function upsertLocal(it){
  const i = S.items.findIndex(x=>x.id===it.id);
  if(i>=0) S.items[i]=it; else S.items.push(it);
  reindex();
}

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /boards/{board} {

      function isEditor() {
        return request.auth != null &&
          exists(/databases/$(database)/documents/boards/$(board)/editors/$(request.auth.uid));
      }
      function codeMatches() {
        return request.resource.data.code ==
          get(/databases/$(database)/documents/boards/$(board)/config/access).data.code;
      }

      // the edit code itself: the app can never read it or change it
      match /config/{doc} {
        allow read, write: if false;
      }

      // a device claims editing rights by presenting the code
      match /editors/{uid} {
        allow read:          if request.auth != null && request.auth.uid == uid;
        allow create, update: if request.auth != null && request.auth.uid == uid && codeMatches();
        allow delete:        if false;
      }

      // the manual itself: everyone reads, only editors write
      match /items/{doc}   { allow read: if true; allow write: if isEditor(); }
      match /benches/{doc} { allow read: if true; allow write: if isEditor(); }
      match /spots/{doc}   { allow read: if true; allow write: if isEditor(); }
      match /images/{doc}  { allow read: if true; allow write: if isEditor(); }
    }
  }
}`;

      };
      const benches = [];
      for(const one of (d.benches||[])){ const r = await restore(one); await Store.saveBench(r); benches.push(r); }
      const spots = [];
      for(const one of sp){ const r = await restore(one); await Store.saveSpot(r); spots.push(r); }
      S.items = d.items; S.benches = benches; S.spots = spots; reindex();
      closeModal(); render(); toast("Imported");
    }catch(err){ toast("Import failed: "+err.message,1) }
  };

  if($("#wipe")) $("#wipe").onclick = async ()=>{
    if(!confirm("Erase every item, bench, saved spot and screenshot? This cannot be undone.")) return;
    if(!confirm("Really sure? Export a backup first if you're not.")) return;
    await Store.replaceAll([],[],[]);
    S.items=[]; S.benches=[]; S.spots=[]; reindex(); closeModal(); render(); toast("Wiped");
  };
}
function download(name, text, mime){
  const b = new Blob([text],{type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
const TABS = [
  {id:"catalogue", label:"Catalogue",  n:()=>S.items.length},
  {id:"planner",   label:"Planner",    n:()=>S.targets.length||""},
  {id:"benches",   label:"Benches",    n:()=>S.benches.length},
  {id:"dropoff",   label:"Drop Offs",  n:()=>spotsOf("dropoff").length||""},
  {id:"busblock",  label:"Bus Blocks", n:()=>spotsOf("busblock").length||""}
];

function refreshDatalist(){
  // dlItems is everything (ingredient autocomplete); dlCraft is only things you
  // can actually make, which is all the planner should ever suggest.
  $("#dlItems").innerHTML = S.items.map(i=>`<option value="${esc(i.name)}">`).join("");
  $("#dlBp").innerHTML = S.items.filter(isBlueprint)
    .slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(i=>`<option value="${esc(i.name)}">`).join("");
  $("#dlCraft").innerHTML = S.items.filter(isCraftable)
    .slice().sort((a,b)=>a.name.localeCompare(b.name))
    .map(i=>`<option value="${esc(i.name)}">`).join("");
}

function render(){
  $("#tabs").innerHTML = TABS.map(t=>
    `<button class="${S.tab===t.id?"on":""}" data-tab="${t.id}">${t.label}${t.n()!==""?`<span class="n">${t.n()}</span>`:""}</button>`).join("");
  $("#view").innerHTML =
    S.tab==="catalogue" ? viewCatalogue() :
    S.tab==="planner"   ? viewPlanner()   :
    S.tab==="benches"   ? viewBenches()   : viewSpots(S.tab);
  refreshDatalist();
  paintLock();
  wireView();
}

function wireView(){
  const q = $("#q");
  if(q){
    q.oninput = e=>{ S.q = e.target.value; const p=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  }
  const fb = $("#fBench");
  if(fb) fb.onchange = e=>{ S.fBench=e.target.value; render(); };

  $$("[data-flag]").forEach(b=> b.onclick = ()=>{ S.fFlag = S.fFlag===b.dataset.flag? "" : b.dataset.flag; if(b.dataset.flag==="") S.fFlag=""; render(); });
  $$("[data-cat]").forEach(b=> b.onclick = ()=>{ S.fCat = S.fCat===b.dataset.cat? "" : b.dataset.cat; render(); });

  const sq = $("#sq");
  if(sq) sq.oninput = e=>{ S.spotQ = e.target.value; const p=e.target.selectionStart; render(); const n=$("#sq"); n.focus(); n.setSelectionRange(p,p); };
  $$("[data-stag]").forEach(b=> b.onclick = ()=>{ S.spotTag = b.dataset.stag; render(); });

  const ab = $("#addBench1"); if(ab) ab.onclick = ()=>openBench(null);

  // planner
  const pa = $("#planAddBtn");
  if(pa){
    const add = ()=>{
      const n = $("#planAdd").value.trim(); if(!n) return;
      const qy = Math.max(1, parseInt($("#planQty").value)||1);
      const ex = S.targets.find(t=>norm(t.name)===norm(n));
      if(ex) ex.qty += qy; else S.targets.push({name:n, qty:qy});
      $("#planAdd").value=""; $("#planQty").value=1; render(); $("#planAdd").focus();
    };
    pa.onclick = add;
    $("#planAdd").onkeydown = e=>{ if(e.key==="Enter") add(); };
  }
  $$("[data-tq]").forEach(i=> i.onchange = ()=>{ S.targets[+i.dataset.tq].qty = Math.max(1,parseInt(i.value)||1); render(); });
  $$("[data-trm]").forEach(b=> b.onclick = ()=>{ S.targets.splice(+b.dataset.trm,1); render(); });
  const pc = $("#planClear"); if(pc) pc.onclick = ()=>{ S.targets=[]; render(); };
  const us = $("#useStock"); if(us) us.onchange = ()=>{ S.useStock = us.checked; render(); };
  $$("[data-ownbp]").forEach(c=> c.onchange = ()=>{
    const k = norm(c.dataset.ownbp);
    if(c.checked) S.stock[k] = Math.max(1, S.stock[k]||0); else delete S.stock[k];
    saveStock(); render();
  });
  $$("[data-stock]").forEach(i=> i.onchange = ()=>{
    const k = norm(i.dataset.stock);
    const v = Math.max(0, parseInt(i.value)||0);
    if(v) S.stock[k]=v; else delete S.stock[k];
    saveStock(); render();
  });
}

// One delegated handler for everything that opens an item.
document.addEventListener("click", e=>{
  const c = e.target.closest("[data-close]"); if(c){ closeModal(); return; }
  const del = e.target.closest("[data-del]");
  if(del){
    const it = S.items.find(x=>x.id===del.dataset.del); if(!it) return;
    if(!confirm(`Delete "${it.name}"?`)) return;
    Store.delItem(it.id).then(()=>{
      S.items = S.items.filter(x=>x.id!==it.id); reindex(); closeModal(); render(); toast("Deleted");
    }).catch(()=>toast("Delete failed",1));
    return;
  }
  const eb = e.target.closest("[data-editbench]"); if(eb){ openBench(eb.dataset.editbench); return; }
  const ed = e.target.closest("[data-edit]"); if(ed){ openEdit(ed.dataset.edit); return; }
  const pl = e.target.closest("[data-plan]");
  if(pl){
    const n = pl.dataset.plan;
    const ex = S.targets.find(t=>norm(t.name)===norm(n));
    if(ex) ex.qty++; else S.targets.push({name:n, qty:1});
    closeModal(); S.tab="planner"; render(); toast("Added to plan");
    return;
  }
  const tab = e.target.closest("[data-tab]"); if(tab){ S.tab = tab.dataset.tab; S.spotQ=""; S.spotTag=""; render(); return; }

  const vb = e.target.closest("[data-viewbench]"); if(vb){ openBenchView(vb.dataset.viewbench); return; }
  const ns = e.target.closest("[data-newspot]");  if(ns){ openSpotEdit(null, ns.dataset.newspot); return; }
  const es = e.target.closest("[data-editspot]"); if(es){ openSpotEdit(es.dataset.editspot); return; }
  const ds = e.target.closest("[data-delspot]");
  if(ds){
    const sp = S.spots.find(x=>x.id===ds.dataset.delspot); if(!sp) return;
    if(!confirm(`Delete "${sp.name}"?`)) return;
    Store.delSpot(sp.id).then(async ()=>{
      for(const e of (sp.images||[])){ const id = imgId(e); if(id) await dropImage(id); }
      S.spots = S.spots.filter(x=>x.id!==sp.id); closeModal(); render(); toast("Deleted");
    }).catch(()=>toast("Delete failed",1));
    return;
  }
  const sh = e.target.closest("[data-shot]"); if(sh){ openShot(sh.src); return; }
  const sp = e.target.closest("[data-spot]"); if(sp){ openSpot(sp.dataset.spot); return; }

  const idEl = e.target.closest("[data-id]"); if(idEl){ openItem(idEl.dataset.id); return; }
});

$("#fab").onclick = ()=> KIND[S.tab] ? openSpotEdit(null, S.tab) : openEdit(null);
$("#btnData").onclick = openData;
$("#btnLock").onclick = openUnlock;

function paintLock(){
  const b = $("#btnLock");
  b.hidden = !CLOUD;
  b.textContent = S.canEdit ? "Editing on" : "View only · unlock";
  b.style.color = S.canEdit ? "var(--acc)" : "var(--warn)";
  $("#fab").hidden = !S.canEdit;
}

function openUnlock(){
  if(S.canEdit) return openModal(`
    <div class="mhead"><div style="flex:1"><h2>Editing is on</h2>
      <div class="sub">This device can add and change things.</div></div>
      <button class="x" data-close>×</button></div>
    <div class="mbody"><div class="tiny muted">Unlocked for this browser. Clearing your site data signs you
      out and you'd enter the code again. To take a device's access away, delete its row from
      <b>boards → ${esc(BOARD)} → editors</b> in the Firebase console.</div></div>
    <div class="mfoot"><button class="btn ghost" data-close>Close</button></div>`);

  openModal(`
    <div class="mhead"><div style="flex:1"><h2>Unlock editing</h2>
      <div class="sub">Everyone can read and use the planner. Adding and changing needs the crew's edit code.</div></div>
      <button class="x" data-close>×</button></div>
    <div class="mbody">
      <label class="f">Edit code</label>
      <input id="u_code" type="password" placeholder="Ask whoever set this up" autofocus>
      <div class="tiny muted" style="margin-top:8px">Remembered on this browser once it works.</div>
      <div class="tiny" id="u_err" style="color:var(--bad);margin-top:8px"></div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn primary" id="u_go">Unlock</button>
    </div>`);

  const go = async ()=>{
    const code = $("#u_code").value.trim();
    if(!code) return;
    const btn = $("#u_go"); btn.disabled = true; btn.textContent = "Checking…";
    try{
      await claimEditor(code);
      closeModal(); paintLock(); render(); toast("Editing unlocked");
    }catch(err){
      btn.disabled = false; btn.textContent = "Unlock";
      $("#u_err").textContent = /permission|insufficient/i.test(err.message||"")
        ? "That code isn't right." : ("Couldn't check that: "+(err.message||err));
    }
  };
  $("#u_go").onclick = go;
  $("#u_code").onkeydown = e=>{ if(e.key==="Enter") go(); };
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot(){
  document.title = CONFIG.APP_NAME;
  $("#brandName").textContent = CONFIG.APP_NAME;
  $("#brandSub").textContent  = CONFIG.APP_SUB;
  $("#brandMark").src = LOGO;
  $("#brandMark").alt = CONFIG.APP_NAME;
  const fav = document.createElement("link");
  fav.rel = "icon"; fav.type = "image/png"; fav.href = LOGO_FAV;
  document.head.appendChild(fav);
  initCloud();
  $("#modePill").className = "pill " + (CLOUD? "live":"solo");
  $("#modeTxt").textContent = CLOUD? "Shared · live" : "Solo · this device";

  // Keys are filled in but Firestore didn't come up — say so loudly rather than
  // silently writing to this device while the crew sees nothing.
  if(configured() && !CLOUD){
    $("#modePill").className = "pill solo";
    $("#modeTxt").textContent = "Offline · not syncing";
    toast("Can't reach Firebase — running on this device only", 1);
  }

  if(CLOUD){
    try{ await signIn(); await checkEditor(); }
    catch(err){ console.warn("sign-in failed", err.message); S.canEdit = false; }
  }else S.canEdit = true;

  try{
    const d = await Store.loadAll();
    S.items = d.items; S.benches = d.benches; S.spots = d.spots||[]; reindex();
  }catch(err){
    console.error(err); toast("Couldn't load data: "+(err.message||err), 1);
  }
  render();

  Store.subscribe(async ()=>{
    try{
      const d = await Store.loadAll();
      S.items = d.items; S.benches = d.benches; S.spots = d.spots||[]; reindex();
      if($("#overlay").hidden) render();
    }catch(e){}
  });
}
// The Firebase SDK is a module script, so it finishes after this one. Wait for
// it when the keys are set; start straight away when they aren't.
if(!configured() || window.__fb || window.__fbFailed) boot();
else{
  let started = false;
  const go = ()=>{ if(!started){ started = true; boot(); } };
  window.addEventListener("fb-ready", go, {once:true});
  setTimeout(go, 8000);   // never leave the page stuck on "loading…"
}
</script>
