  }
  if(e.key==="/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
    const s=$("#q"); if(s){ e.preventDefault(); s.focus(); }
  }
});

/* =====================================================================
   VIEW: CATALOGUE
   ===================================================================== */
function categories(){
  return [...new Set(S.items.map(i=>i.category).filter(Boolean))].sort();
}
// Four filters can be on at once, so one reset beats hunting three controls.
const anyFilter = () => !!(S.q || S.fBench || S.fCat || S.fFlag);

function filtered(){
  const q = norm(S.q);
  return S.items.filter(it=>{
    if(S.fBench && !allBenches(it).includes(S.fBench)) return false;
    if(S.fCat && it.category!==S.fCat) return false;
    if(S.fFlag==="craft" && !isCraftable(it)) return false;
    if(S.fFlag==="raw" && (isCraftable(it) || isBlueprint(it))) return false;
    if(S.fFlag==="bp" && !isBlueprint(it)) return false;
    if(S.fFlag==="gaps" && gapsOf(it).length===0) return false;
    if(S.fFlag==="nosrc" && !noSource(it)) return false;
    if(!q) return true;
    if(norm(it.name).includes(q)) return true;
    if(norm(it.category).includes(q)) return true;
    if(allBenches(it).some(b=>norm(benchName(b)).includes(q))) return true;
    return allIngredients(it).some(g=>norm(g.name).includes(q));
  }).sort((a,b)=>a.name.localeCompare(b.name));
}

function viewCatalogue(){
  const cats = categories();
  const list = filtered();
  const gapCount = S.items.filter(i=>gapsOf(i).length).length;
  const srcCount = S.items.filter(noSource).length;

  return `
  <div class="toolbar">
    <div class="search">
      <span class="ico">⌕</span>
      <input id="q" placeholder="Search items, ingredients, benches…  ( / )" value="${esc(S.q)}">
    </div>
    <select id="fBench" style="width:auto;min-width:140px">
      <option value="">All benches</option>
      ${S.benches.map(b=>`<option value="${b.id}" ${S.fBench===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}
    </select>
    ${cats.length? `<select id="fCat" style="width:auto;min-width:140px">
      <option value="">All categories</option>
      ${cats.map(c=>`<option value="${esc(c)}" ${S.fCat===c?"selected":""}>${esc(c)}</option>`).join("")}
    </select>`:""}
  </div>
  <div class="chips" style="margin:-6px 0 16px">
    <button class="chip ${S.fFlag==="craft"?"on":""}" data-flag="craft">Craftable</button>
    <button class="chip ${S.fFlag==="raw"?"on":""}" data-flag="raw">Materials</button>
    ${S.items.some(isBlueprint)? `<button class="chip ${S.fFlag==="bp"?"on":""}" data-flag="bp">Blueprints <span class="tiny">${S.items.filter(isBlueprint).length}</span></button>`:""}
    ${gapCount? `<button class="chip warnchip ${S.fFlag==="gaps"?"on":""}" data-flag="gaps">Needs attention <span class="tiny">${gapCount}</span></button>`:""}
    ${srcCount? `<button class="chip ${S.fFlag==="nosrc"?"on":""}" data-flag="nosrc">No source yet <span class="tiny">${srcCount}</span></button>`:""}
    ${anyFilter()? `<button class="chip clearchip" id="clearFilters">✕ Clear${list.length!==S.items.length? ` <span class="tiny">${list.length} of ${S.items.length}</span>`:""}</button>`:""}
  </div>
  ${ list.length ? `<div class="items">${list.map(itemCard).join("")}</div>`
    : `<div class="empty"><div class="big">⚒</div>
        <div style="font-weight:700;color:var(--dim);margin-bottom:6px">${S.items.length? "Nothing matches that." : "Nothing in here yet."}</div>
        <div class="tiny">${S.items.length? "Try clearing the filters." : (S.canEdit? "Hit the + button to add your first recipe. Ingredients you name get created automatically." : "Nothing has been added yet.")}</div>
      </div>` }`;
}

function itemCard(it){
  const craft = isCraftable(it);
  const r0    = recipesOf(it)[0];          // the card shows the first recipe
  const gaps  = gapsOf(it);
  let badge = "";
  if(isBlueprint(it)) badge = `<span class="badge bp">BLUEPRINT</span>`;
  else if(!craft) badge = `<span class="badge raw">MATERIAL</span>`;
  else{
    if(S.money){
      const e = itemEconomics(it);
      if(e && e.profit!=null) badge = `<span class="badge ${e.profit>=0?"prof":"loss"}">${e.profit>=0?"+":""}${money(e.profit)}</span>`;
    }
    if(!badge && gaps.length) badge = `<span class="badge gap">${gaps.length} gap${gaps.length>1?"s":""}</span>`;
  }
  const ings = craft
    ? `<div class="ing clamp">${r0.ingredients.map(g=>`<b>${esc(String(g.qty??"?"))}×</b> ${esc(g.name)}`).join(" · ")}</div>`
    : (()=>{
        // nothing to say about a bare material — an empty line reads better than
        // "source not set" nagging from every card
        const bits = [];
        if(it.source) bits.push(esc(it.source));
        if(S.money && num(it.buyCost)!=null) bits.push(money(it.buyCost)+" ea");
        return bits.length? `<div class="ing muted">${bits.join(" · ")}</div>` : "";
      })();
  // The category is already a filter, so it doesn't earn a chip on every card,
  // and a needed blueprint is a mark by the name rather than a fifth tag.
  // The stripe down the left edge is the bench's colour, so a glance at the grid
  // sorts it by bench without reading a word. One bench only — a two-bench item
  // keeps the neutral stripe and says so in its tags.
  const bs = allBenches(it);
  const stripe = bs.length===1 ? benchColor(bs[0]) : null;
  return `<div class="item${stripe?" striped":""}" data-id="${it.id}"${stripe?` style="--stripe:${stripe}"`:""}>
    ${badge}
    <div class="nm">${r0.blueprints.length? `<span class="bpmark" title="needs a blueprint">◆</span> `:""}${esc(it.name)}${r0.outputQty>1?` <span class="muted tiny">×${r0.outputQty}</span>`:""}</div>
    <div class="sub">
      ${allBenches(it).map(b=>`<span class="tag tbench" style="${benchTagStyle(b)}">${esc(benchName(b))}</span>`).join("")}
      ${num(r0.craftTime)!=null? `<span class="tag">${dur(r0.craftTime)}</span>`:""}
      ${r0.levelReq? `<span class="tag">lvl ${esc(r0.levelReq)}</span>`:""}
      ${altCount(it)? `<span class="tag tmulti">${altCount(it)+1} ways</span>`:""}
    </div>
    ${ings}
  </div>`;
}

/* =====================================================================
   VIEW: BENCHES
   ===================================================================== */
function viewBenches(){
  if(!S.benches.length) return `<div class="empty"><div class="big">🏭</div>
    <div style="font-weight:700;color:var(--dim);margin-bottom:6px">No benches yet.</div>
    <div class="tiny" style="margin-bottom:16px">Add every crafting bench in the city — then each recipe gets tagged to one.</div>
    ${S.canEdit? `<button class="btn primary" id="addBench1">Add a bench</button>`:""}</div>`;

  const unassigned = S.items.filter(i=>isCraftable(i) && !allBenches(i).length);
  return `
  <div class="toolbar" style="justify-content:space-between">
    <div class="sec-title" style="margin:0">${S.benches.length} bench${S.benches.length>1?"es":""}</div>
    ${S.canEdit? `<button class="btn sm" id="addBench1">+ Add bench</button>`:""}
  </div>
  <div class="benches">
    ${S.benches.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b=>{
      const mine = S.items.filter(i=>allBenches(i).includes(b.id)).sort((x,y)=>x.name.localeCompare(y.name));
      const c = benchColor(b.id);
      const cover = imgThumb((b.images||[])[0]);
      return `<div class="bench" style="border-left:3px solid ${c}">
        ${cover? `<div class="bthumb" data-viewbench="${b.id}"><img src="${esc(cover)}" alt="" loading="lazy">
          ${(b.images||[]).length>1? `<span class="count">${b.images.length}</span>`:""}</div>`:""}
        <div class="bbody">
          <h3 data-viewbench="${b.id}"><span class="bdot" style="background:${c}"></span>${esc(b.name)}</h3>
          <div class="loc">${b.location? esc(b.location) : "<span class='muted'>location not set</span>"}</div>
          <div class="cnt">${mine.length} recipe${mine.length===1?"":"s"}${(b.images||[]).length&&!cover?" · has photos":""}</div>
          ${b.notes? `<div class="tiny muted" style="margin-top:7px">${esc(b.notes)}</div>`:""}
          <div class="list">${mine.slice(0,14).map(i=>`<span data-id="${i.id}">${esc(i.name)}</span>`).join("")}
            ${mine.length>14?`<span class="muted">+${mine.length-14}</span>`:""}</div>
          <div style="margin-top:12px;display:flex;gap:8px">
            <button class="btn sm ghost" data-viewbench="${b.id}">${(b.images||[]).length? "Photos":"Details"}</button>
            ${S.canEdit? `<button class="btn sm ghost" data-editbench="${b.id}">Edit</button>`:""}
          </div>
        </div>
      </div>`;
    }).join("")}
  </div>
  ${unassigned.length? `<div class="card" style="margin-top:16px;border-color:rgba(251,191,36,.3)">
    <div class="sec-title" style="color:var(--warn)">${unassigned.length} recipe${unassigned.length>1?"s":""} with no bench assigned</div>
    <div class="list" style="margin:0">${unassigned.map(i=>`<span data-id="${i.id}">${esc(i.name)}</span>`).join("")}</div>
  </div>`:""}`;
}

/* =====================================================================
   VIEW: PLANNER
   ===================================================================== */
function viewPlanner(){
  const r = S.targets.length ? rollupMany(S.targets,{useStock:S.useStock, pick:S.pick}) : null;

  const left = `<div class="card">
    <div class="sec-title">What are you making?</div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="planAdd" list="dlCraft" placeholder="What are you crafting?" style="flex:1">
      <input id="planQty" type="number" min="1" value="1" style="width:70px;text-align:center">
      <button class="btn primary" id="planAddBtn">Add</button>
    </div>
    ${S.targets.length? S.targets.map((t,i)=>`
      <div class="target">
        <span class="nm">${esc(t.name)}</span>
        <input type="number" min="1" value="${t.qty}" data-tq="${i}">
        <button class="btn sm ghost" data-trm="${i}">✕</button>
      </div>`).join("") : `<div class="tiny muted">Add a few items and you'll get one combined materials list.</div>`}
    ${S.targets.length? `<button class="btn sm ghost" id="planClear" style="margin-top:12px">Clear all</button>`:""}
    <label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;cursor:pointer">
      <input type="checkbox" id="useStock" ${S.useStock?"checked":""} style="width:auto">
      Subtract what I already have
    </label>
  </div>`;

  if(!r) return `<div class="plan">${left}<div class="empty"><div class="big">📋</div>
    <div style="font-weight:700;color:var(--dim)">Nothing planned yet.</div>
    <div class="tiny">Pick your items on the left.</div></div></div>`;

  // Raw materials still needed, plus any that your stock already covers
  // (kept visible so you can correct the count without hunting for it).
  const shop = r.raw.filter(x=>x.qty>0);
  for(const [k,v] of r.fromHave){
    const it = S.byName.get(k);
    if(isCraftable(it)) continue;                       // covered sub-craft, not a shopping row
    if(shop.some(x=>norm(x.name)===k)) continue;
    shop.push({ name:(it&&it.name)||k, qty:0, item:it||null });
  }
  shop.sort((a,b)=> (b.qty>0)-(a.qty>0) || a.name.localeCompare(b.name));
  const groups = {};
  for(const s of r.steps){
    const k = s.rec.benchId || "__none__";
    (groups[k] = groups[k] || {depth:-1, steps:[]});
    groups[k].steps.push(s);
    groups[k].depth = Math.max(groups[k].depth, s.depth);
  }
  const order = Object.keys(groups).sort((a,b)=>groups[b].depth-groups[a].depth);

  const right = `
    <div>
      <div class="stats">
        <div class="stat"><div class="k">Materials to get</div><div class="v">${shop.filter(x=>x.qty>0).length}</div></div>
        <div class="stat"><div class="k">Crafts to run</div><div class="v">${r.steps.reduce((a,s)=>a+s.crafts,0)}</div></div>
        ${r.blueprints.length? `<div class="stat"><div class="k">Blueprints</div>
          <div class="v ${r.blueprints.every(bp=>ownsBp(bp.name))?"good":"bad"}">${r.blueprints.filter(bp=>ownsBp(bp.name)).length}/${r.blueprints.length}</div>
          <div class="tiny muted">you own</div></div>`:""}
        ${S.money? `<div class="stat"><div class="k">Est. cost</div><div class="v gold">${r.missingCost? "—" : money(r.cost)}</div>
          ${r.missingCost?`<div class="tiny muted">${r.missingCost} missing price${r.missingCost>1?"s":""}</div>`:""}</div>`:""}
        <div class="stat"><div class="k">Craft time</div><div class="v">${r.missingTime? "—" : dur(r.time)}</div>
          ${r.missingTime?`<div class="tiny muted">${r.missingTime} missing</div>`:""}</div>
      </div>

      ${r.unknown.length? `<div class="card" style="border-color:rgba(251,191,36,.35);margin-bottom:16px">
        <div class="sec-title" style="color:var(--warn)">Not in the manual yet</div>
        <div class="tiny">${r.unknown.map(esc).join(", ")} — treated as raw materials. Add them to price them properly.</div>
      </div>`:""}
      ${r.loop? `<div class="card" style="border-color:rgba(248,113,113,.35);margin-bottom:16px">
        <div class="sec-title" style="color:var(--bad)">Recipe loop detected</div>
        ${r.loopChain? `<div style="margin-bottom:8px;font-weight:650">${r.loopChain.map(esc).join(" → ")}</div>`:""}
        <div class="tiny">That chain comes back to where it started, so the totals below are a best guess.
        Usually it means something lists itself as its own ingredient or blueprint — open the first item above and check.</div>
      </div>`:""}

      ${r.choices.length? `<div class="card" style="margin-bottom:16px">
        <div class="sec-title">More than one way to make these</div>
        <div class="tiny muted" style="margin-bottom:10px">Switch a route and everything below updates.</div>
        ${r.choices.map(c=>`<div class="pickrow">
          <span class="nm">${esc(c.item.name)}</span>
          <select data-pickfor="${esc(c.item.name)}">
            ${recipesOf(c.item).map((rc,i)=>{
              const bits = [rc.benchId? benchName(rc.benchId) : "no bench"];
              if(num(rc.craftTime)!=null) bits.push(dur(rc.craftTime));
              if(rc.outputQty>1) bits.push("makes "+rc.outputQty);
              return `<option value="${rc.key}" ${rc.key===c.rec.key?"selected":""}>${
                esc(rc.label || "Recipe "+(i+1))} — ${esc(bits.join(" · "))}</option>`;
            }).join("")}
          </select>
        </div>`).join("")}
      </div>`:""}

      ${r.blueprints.length? `<div class="card" style="margin-bottom:16px">
        <div class="sec-title">Blueprints needed</div>
        <div class="tscroll"><table>
          <thead><tr><th>Blueprint</th><th class="num">Need</th><th>Type</th><th class="num">Got it</th><th>Where from</th></tr></thead>
          <tbody>${r.blueprints.map(bp=>{
            const have = ownsBp(bp.name);
            return `<tr>
              <td>${esc(bp.name)}${bp.item?"":' <span class="tag" style="color:var(--warn)">new</span>'}</td>
              <td class="num mono" style="font-weight:700">${bp.unlock? "1" : bp.qty}</td>
              <td class="tiny muted">${bp.unlock? "unlock — keep it" : "used up each craft"}</td>
              <td class="num"><input type="checkbox" data-ownbp="${esc(bp.name)}" ${have?"checked":""} style="width:auto"></td>
              <td class="tiny muted">${bp.item&&bp.item.source? esc(bp.item.source):"—"}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        ${r.blueprints.some(bp=>!ownsBp(bp.name))
          ? `<div class="tiny" style="color:var(--warn);margin-top:10px">You're missing ${r.blueprints.filter(bp=>!ownsBp(bp.name)).map(bp=>esc(bp.name)).join(", ")} — you can't run this without ${r.blueprints.filter(bp=>!ownsBp(bp.name)).length>1?"them":"it"}.</div>`
          : `<div class="tiny" style="color:var(--acc);margin-top:10px">You have every blueprint this needs.</div>`}
      </div>`:""}

      <div class="card" style="margin-bottom:16px">
        <div class="sec-title">Shopping list — raw materials</div>
        <div class="tscroll"><table>
          <thead><tr><th>Material</th><th class="num">${S.useStock?"Still need":"Need"}</th><th class="num">On hand</th>${S.money?'<th class="num">Cost</th>':""}<th>Source</th></tr></thead>
          <tbody>${shop.map(x=>{
            const k = norm(x.name);
            const have = S.stock[k]||0;
            const c = x.item? num(x.item.buyCost) : null;
            return `<tr>
              <td>${esc(x.name)}${x.item?"":' <span class="tag" style="color:var(--warn)">new</span>'}</td>
              <td class="num mono" style="font-weight:700">${x.qty}</td>
              <td class="num"><input type="number" min="0" value="${have}" data-stock="${esc(x.name)}" style="width:66px;text-align:center;padding:4px"></td>
              ${S.money?`<td class="num mono">${c==null? '<span class="muted">—</span>' : money(c*x.qty)}</td>`:""}
              <td class="tiny muted">${x.item&&x.item.source? esc(x.item.source):"—"}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>
        ${r.fromHave.size? `<div class="tiny muted" style="margin-top:10px">Already covered from your stock: ${[...r.fromHave].map(([k,v])=>v+"× "+((S.byName.get(k)||{}).name||k)).join(", ")}</div>`:""}
      </div>

      <div class="card">
        <div class="sec-title">Bench route — in order</div>
        ${order.length? order.map((k,i)=>{
          const b = benchOf(k);
          const c = b? benchColor(b.id) : null;
          return `<div class="benchgroup">
            <h4><span class="step" style="${c?`background:${hexA(c,.18)};color:${c}`:""}">${i+1}</span>
              <span style="${c?`color:${c}`:""}">${b? esc(b.name) : "Bench not set"}</span>
              ${b&&b.location? `<span class="loc">${esc(b.location)}</span>`:""}</h4>
            <div class="tscroll"><table>
              <thead><tr><th>Craft</th><th class="num">Runs</th><th class="num">Yield</th><th class="num">Time</th></tr></thead>
              <tbody>${groups[k].steps.map(s=>`<tr>
                <td><span class="nm craftable" data-id="${s.item.id}" style="color:var(--acc2);cursor:pointer">${esc(s.item.name)}</span></td>
                <td class="num mono">${s.crafts}</td>
                <td class="num mono">${s.crafts*Math.max(1,s.rec.outputQty||1)}</td>
                <td class="num mono">${num(s.rec.craftTime)!=null? dur(s.rec.craftTime*s.crafts) : "—"}</td>
              </tr>`).join("")}</tbody>
            </table></div>
          </div>`;
        }).join("") : `<div class="tiny muted">Everything on your list is a raw material — nothing to craft.</div>`}
      </div>
    </div>`;

  return `<div class="plan">${left}${right}</div>`;
}

/* =====================================================================
   VIEW: SPOTS (drop offs / bus blocks)
   ===================================================================== */
const KIND = {
  dropoff:  { label:"Drop Offs",  one:"drop off",  icon:"🚗",
              blurb:"Where you ditch the hot car or swap into a clean one.",
              nameHint:"e.g. Vespucci parking garage, level 3" },
  busblock: { label:"Bus Blocks", one:"bus block", icon:"🚌",
              blurb:"Spots to park something big and choke the road behind you.",
              nameHint:"e.g. Tunnel mouth under Olympic" },
  heist:    { label:"Heists",     one:"heist",     icon:"💰",
              blurb:"Crew size, gear, the hacks to expect and how it runs.",
              nameHint:"e.g. Paleto bank" }
};
const gearOf  = h => (h && h.gear)  || [];
const hacksOf = h => (h && h.hacks) || [];
const stepsOf = h => (h && h.steps) || [];
const spotsOf = k => S.spots.filter(s=>s.kind===k);
const tagsOf  = k => [...new Set(spotsOf(k).flatMap(s=>s.tags||[]))].sort();

function viewSpots(kind){
  const K = KIND[kind];
  const q = norm(S.spotQ);
  let list = spotsOf(kind);
  if(S.spotTag) list = list.filter(s=>(s.tags||[]).includes(S.spotTag));
  if(q) list = list.filter(s =>
    norm(s.name).includes(q) || norm(s.area).includes(q) ||
    norm(s.notes).includes(q) || norm(s.blocks).includes(q) ||
    (s.tags||[]).some(t=>norm(t).includes(q)) ||
    gearOf(s).some(g=>norm(g.name).includes(q)) ||
    hacksOf(s).some(h=>norm(h.name).includes(q)) ||
    stepsOf(s).some(t=>norm(t).includes(q)));
  list = list.slice().sort((a,b)=> (a.area||"~").localeCompare(b.area||"~") || a.name.localeCompare(b.name));

  const tags = tagsOf(kind);
  if(!spotsOf(kind).length) return `<div class="empty"><div class="big">${K.icon}</div>
    <div style="font-weight:700;color:var(--dim);margin-bottom:6px">No ${K.label.toLowerCase()} saved yet.</div>
    <div class="tiny" style="margin-bottom:16px">${K.blurb}</div>
    ${S.canEdit? `<button class="btn primary" data-newspot="${kind}">Add a ${K.one}</button>`:""}</div>`;

  return `
  <div class="toolbar">
    <div class="search">
      <span class="ico">⌕</span>
      <input id="sq" placeholder="Search ${K.label.toLowerCase()}…" value="${esc(S.spotQ)}">
    </div>
    ${S.canEdit? `<button class="btn sm" data-newspot="${kind}">+ Add ${K.one}</button>`:""}
  </div>
  ${tags.length? `<div class="chips" style="margin:-6px 0 16px">
    <button class="chip ${S.spotTag===""?"on":""}" data-stag="">All <span class="tiny">${spotsOf(kind).length}</span></button>
    ${tags.map(t=>`<button class="chip ${S.spotTag===t?"on":""}" data-stag="${esc(t)}">${esc(t)}</button>`).join("")}
  </div>`:""}
  ${list.length? `<div class="spots">${list.map(spotCard).join("")}</div>`
   : `<div class="empty"><div class="tiny">Nothing matches that.</div></div>`}`;
}

function spotCard(s){
  const img = imgThumb((s.images||[])[0]);
  return `<div class="spot" data-spot="${s.id}">
    <div class="thumb">${img? `<img src="${esc(img)}" alt="" loading="lazy">` : `<span>${KIND[s.kind].icon}</span>`}
      ${(s.images||[]).length>1? `<span class="count">${s.images.length}</span>`:""}</div>
    <div class="body">
      <div class="nm">${esc(s.name)}</div>
      ${s.area? `<div class="area">${esc(s.area)}</div>`:""}
      ${s.blocks? `<div class="blocks">⛔ ${esc(s.blocks)}</div>`:""}
      ${s.kind==="heist"? `<div class="hmeta">
        ${s.crew? `<span class="tag tcrew">👥 ${esc(s.crew)}</span>`:""}
        ${gearOf(s).length? `<span class="tag">${gearOf(s).length} gear</span>`:""}
        ${hacksOf(s).length? `<span class="tag thack">${hacksOf(s).length} hack${hacksOf(s).length>1?"s":""}</span>`:""}
        ${stepsOf(s).length? `<span class="tag">${stepsOf(s).length} steps</span>`:""}
      </div>`:""}
      ${(s.tags||[]).length? `<div class="tagrow">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
    </div>
  </div>`;
}

/* ---------- spot detail ---------- */
function openSpot(id){
  const s = S.spots.find(x=>x.id===id); if(!s) return;
  if(s.kind==="heist") return openHeist(s);
  const K = KIND[s.kind];
  openModal(`
    <div class="mhead">
      <div style="flex:1"><h2>${K.icon} ${esc(s.name)}</h2>
      <div class="sub">${s.area? esc(s.area) : K.label}</div></div>
      <button class="x" data-close>×</button>
    </div>
    <div class="mbody">
      ${galleryHTML(s.images, s.id)}
      ${s.blocks? `<div class="sec-title">Blocks</div><div style="margin-bottom:18px">⛔ ${esc(s.blocks)}</div>`:""}
      ${s.vehicle? `<div class="sec-title">Needs</div><div style="margin-bottom:18px">${esc(s.vehicle)}</div>`:""}
      ${s.notes? `<div class="sec-title">How to run it</div><div style="margin-bottom:18px;white-space:pre-wrap">${esc(s.notes)}</div>`:""}
      ${(s.tags||[]).length? `<div class="sec-title">Tags</div><div class="chips">${s.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}
    </div>
    <div class="mfoot">
      ${S.canEdit? `<button class="btn danger" data-delspot="${s.id}">Delete</button>`:""}
      <div class="spacer"></div>
      ${S.canEdit? `<button class="btn primary" data-editspot="${s.id}">Edit</button>`
                 : `<button class="btn ghost" data-close>Close</button>`}
    </div>`, "wide");

  hydrateGallery(s.images, s.id);
}

function openShot(src){
  if(!src) return;
  const box = document.createElement("div");
  box.className = "lightbox";
  box.innerHTML = `<img src="${esc(src)}" alt=""><button class="x">×</button>`;
  box.onclick = ()=>box.remove();
  document.body.appendChild(box);
}

function openHeist(h){
  // gear that matches something in the catalogue can be sent to the planner
  const known = gearOf(h).filter(g=>S.byName.get(norm(g.name)));
  openModal(`
    <div class="mhead">
      <div style="flex:1"><h2>💰 ${esc(h.name)}</h2>
      <div class="sub">${h.area? esc(h.area) : "Heists"}${h.crew? ` · crew of ${esc(h.crew)}`:""}</div></div>
      <button class="x" data-close>×</button>
    </div>
    <div class="mbody">
      ${galleryHTML(h.images, h.id)}

      ${gearOf(h).length? `
        <div class="sec-title">Gear needed</div>
        <div class="tree" style="margin-bottom:18px">
          ${gearOf(h).map(g=>{
            const it = S.byName.get(norm(g.name));
            return `<div class="tnode">
              <span class="q">${esc(String(g.qty||1))}×</span>
              <span class="nm ${it?"craftable":""}" ${it?`data-id="${it.id}"`:""}>${esc(g.name)}</span>
              <span class="meta">${!it? "not in the catalogue"
                : isCraftable(it)? `craft @ <span style="${it.benchId?`color:${benchColor(it.benchId)}`:""}">${esc(benchName(it.benchId)||"?")}</span>`
                : esc(it.source||"material")}</span>
            </div>`;
          }).join("")}
        </div>` : ""}

      ${hacksOf(h).length? `
        <div class="sec-title">Hacks to expect</div>
        <div style="margin-bottom:18px">
          ${(()=>{ const anyShot = hacksOf(h).some(k=>k.shot); return hacksOf(h).map((k,i)=>`<div class="hackrow">
            ${k.shot? `<img src="${esc(imgThumb(k.shot))}" alt="" data-shot="hk${i}" data-spotid="${esc(h.id)}">`
                    : (anyShot? `<span class="noshot"></span>` : "")}
            <div class="txt">
              <span class="q" style="color:#9085e9;font-weight:700">${esc(String(k.qty||1))}×</span>
              <span class="nm" style="font-weight:600">${esc(k.name)}</span>
            </div>
          </div>`).join(""); })()}
        </div>` : ""}

      ${stepsOf(h).length? `
        <div class="sec-title">How it runs</div>
        <ol class="steps">${stepsOf(h).map(t=>`<li>${esc(t)}</li>`).join("")}</ol>` : ""}

      ${h.notes? `<div class="sec-title">Notes</div><div style="margin-bottom:18px;white-space:pre-wrap">${esc(h.notes)}</div>`:""}
      ${(h.tags||[]).length? `<div class="sec-title">Tags</div><div class="chips">${h.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}
    </div>
    <div class="mfoot">
      ${S.canEdit? `<button class="btn danger" data-delspot="${h.id}">Delete</button>`:""}
      <div class="spacer"></div>
      ${known.length? `<button class="btn" data-prep="${h.id}">Prep in planner</button>`:""}
      ${S.canEdit? `<button class="btn primary" data-editspot="${h.id}">Edit</button>`
                 : `<button class="btn ghost" data-close>Close</button>`}
    </div>`, "wide");
  hydrateGallery(h.images, h.id);
  hydrateGallery(hacksOf(h).map(k=>k.shot), h.id, "hk");
}

/* ---------- spot edit ---------- */
function openSpotEdit(id, kind){
  if(!S.canEdit) return toast("You need the edit code to change things",1);
  const s = id ? S.spots.find(x=>x.id===id) : null;
  const k = s? s.kind : kind;
  const K = KIND[k];
  const d = s || { name:"", area:"", blocks:"", vehicle:"", notes:"", tags:[], images:[] };
  Object.keys(HACK_SHOTS).forEach(k=>delete HACK_SHOTS[k]);   // fresh form, fresh pending shots

  openModal(`
    <div class="mhead"><div style="flex:1">
      <h2>${s? "Edit":"New"} ${K.one}</h2>
      <div class="sub">${K.blurb}</div></div>
      <button class="x" data-close>×</button></div>
    <div class="mbody">
      <div style="margin-bottom:12px"><label class="f">Name *</label>
        <input id="s_name" value="${esc(d.name)}" placeholder="${esc(K.nameHint)}" autofocus></div>
      <div style="margin-bottom:12px"><label class="f">Area / landmark</label>
        <input id="s_area" value="${esc(d.area)}" placeholder="Sandy Shores, behind the gas station off Route 68"></div>
      ${k==="heist"? `
      <div class="grid2" style="margin-bottom:12px">
        <div><label class="f">Crew size</label><input id="h_crew" value="${esc(d.crew||"")}" placeholder="4, or 3-5"></div>
        <div><label class="f">Tags</label><input id="s_tags2" value="${esc((d.tags||[]).join(", "))}" placeholder="high payout, needs a hacker"></div>
      </div>

      <div class="sec-title" style="margin-top:18px">Gear needed</div>
      <div id="gearList">${(d.gear||[]).map(gearRow).join("")}</div>
      <button class="btn sm ghost" id="addGear" type="button">+ Add gear</button>
      <div class="tiny muted" style="margin-top:7px">Names that match something in the catalogue get a
        <b>Prep in planner</b> button — it loads the lot into the Planner with the full shopping list.
        Anything else is fine as plain text.</div>

      <div class="sec-title" style="margin-top:22px">Hacks to expect</div>
      <div id="hackList">${(d.hacks||[]).map(hackRow).join("")}</div>
      <input type="file" id="hackFile" accept="image/*" class="hidden">
      <button class="btn sm ghost" id="addHack" type="button">+ Add hack</button>
      <div class="tiny muted" style="margin-top:7px">The square on each row takes a
        <b>screenshot of that hack</b> — click it or drag a picture onto it. One per hack, so the
        crew can see which mini-game they're walking into.</div>

      <div style="margin:22px 0 12px"><label class="f">Steps — one per line</label>
        <textarea id="h_steps" style="min-height:150px" placeholder="Park the van on the east side&#10;Thermite the vault door&#10;Two on the door, two carrying">${esc(stepsOf(d).join("\n"))}</textarea>
        <div class="tiny muted" style="margin-top:5px">They get numbered automatically. Reordering is just moving a line.</div></div>
      ` : k==="busblock"? `
      <div class="grid2" style="margin-bottom:12px">
        <div><label class="f">What it blocks</label><input id="s_blocks" value="${esc(d.blocks)}" placeholder="Northbound tunnel, both lanes"></div>
        <div><label class="f">What you need</label><input id="s_veh" value="${esc(d.vehicle)}" placeholder="Bus, or any box truck"></div>
      </div>` : `
      <div style="margin-bottom:12px"><label class="f">What you need</label>
        <input id="s_veh" value="${esc(d.vehicle)}" placeholder="Somewhere to stash a second car"></div>`}

      ${shotEditorHTML()}

      ${k==="heist"? "" : `<div style="margin:18px 0 12px"><label class="f">Tags</label>
        <input id="s_tags" value="${esc((d.tags||[]).join(", "))}" placeholder="heli-proof, needs 2 cars, night only">
        <div class="tiny muted" style="margin-top:5px">Comma separated. These become the filter chips.</div></div>`}

      <div style="margin-top:18px"><label class="f">${k==="heist"? "Notes":"How to run it"}</label>
        <textarea id="s_notes" placeholder="${k==="heist"? "Anything that doesn't fit a step" : "Come in from the west, back the bus across before the bend…"}">${esc(d.notes)}</textarea></div>
    </div>
    <div class="mfoot">
      <button class="btn ghost" data-close>Cancel</button>
      <button class="btn primary" id="saveSpot">${s? "Save changes":"Add "+K.one}</button>
    </div>`, "wide");

  const shotBox = mountShotEditor(d.images);
  wireHackShots();
  if($("#addGear")) $("#addGear").onclick = ()=>$("#gearList").insertAdjacentHTML("beforeend", gearRow({name:"",qty:1}));
  if($("#addHack")) $("#addHack").onclick = ()=>$("#hackList").insertAdjacentHTML("beforeend", hackRow({name:"",qty:1}));

  $("#saveSpot").onclick = async ()=>{
    const name = $("#s_name").value.trim();
    if(!name) return toast("Give it a name",1);
    const rec = {
      id: s? s.id : uid("sp"), kind:k, name,
      area: $("#s_area").value.trim(),
      blocks: $("#s_blocks")? $("#s_blocks").value.trim() : "",
      vehicle: $("#s_veh")? $("#s_veh").value.trim() : "",
      notes: $("#s_notes").value.trim(),
      tags: ($("#s_tags")||$("#s_tags2")||{value:""}).value.split(",").map(x=>x.trim()).filter(Boolean),
      images: []
    };
    if(k==="heist"){
      rec.crew  = $("#h_crew").value.trim();
      rec.gear  = $$("#gearList .ingrow").map(r=>({
                    name: r.querySelector(".gear-n").value.trim(),
                    qty: Math.max(1, parseInt(r.querySelector(".gear-q").value)||1) })).filter(g=>g.name);
      rec.hacks = $$("#hackList .ingrow").map(r=>{
                    const shot = HACK_SHOTS[r.dataset.hk];
                    return { name: r.querySelector(".hack-n").value.trim(),
                             qty: Math.max(1, parseInt(r.querySelector(".hack-q").value)||1),
                             shot: shot || null };
                  }).filter(g=>g.name);
      rec.steps = $("#h_steps").value.split("\n").map(x=>x.trim()).filter(Boolean);
    }
    const btn = $("#saveSpot");
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      rec.images = await shotBox.commit((s&&s.images)||[]);
      if(k==="heist") await commitHackShots(rec, s);
      const saved = await Store.saveSpot(rec);
      const i = S.spots.findIndex(x=>x.id===saved.id);
      if(i>=0) S.spots[i]=saved; else S.spots.push(saved);
      closeModal(); render(); toast("Saved");
    }catch(err){
      btn.disabled = false; btn.textContent = s? "Save changes":"Add "+K.one;
      toast("Save failed: "+(err.message||err),1);
    }
  };
}

/* ---------------------------------------------------------------------
   The screenshot picker, shared by spots and benches: click, drag, paste,
   or add a link. Uploads are deferred until save so cancelling never
   leaves orphaned images behind.
   --------------------------------------------------------------------- */
function shotEditorHTML(label){
  return `
      <div class="sec-title" style="margin-top:18px">${label||"Screenshots"}</div>
      <div class="dropzone" id="dz">
        <div class="tiny">Click to pick a file, drag one in, or just paste (Ctrl/⌘ V)</div>
        <input type="file" id="s_file" accept="image/*" multiple class="hidden">
      </div>
      <div style="display:flex;gap:8px;margin:8px 0 0">
        <input id="s_url" placeholder="…or paste an image link (Discord, imgur)" style="flex:1">
        <button class="btn sm" id="addUrl">Add</button>
      </div>
      <div class="shotedit" id="shots"></div>
      <div class="tiny muted" id="shotInfo" style="margin-top:6px"></div>`;
}

function mountShotEditor(initial){
  let shots = (initial||[]).slice();

  function paint(){
    $("#shots").innerHTML = shots.map((e,i)=>
      `<div class="sh"><img src="${esc(imgThumb(e))}" alt=""><button type="button" data-rm="${i}">✕</button></div>`).join("");
    $$("#shots [data-rm]").forEach(b=> b.onclick = ()=>{ shots.splice(+b.dataset.rm,1); paint(); });
    const bytes = shots.reduce((a,e)=> a + ((e && e._full)? e._full.length*0.75 : 0), 0);
    const links = shots.filter(e=>e && e.src).length;
    $("#shotInfo").textContent = shots.length
      ? `${shots.length} image${shots.length>1?"s":""}`
        + (links? ` · ${links} link${links>1?"s":""}`:"")
        + (bytes? ` · about ${Math.round(bytes/1024)} KB to upload`:"")
      : "";
  }
  paint();

  async function addFiles(files){
    for(const f of files){
      if(!f || !f.type.startsWith("image/")) continue;
      if(shots.length>=8){ toast("8 images is the limit",1); break; }
      try{
        const {full, thumb} = await prepShot(f);
        shots.push({ thumb, _full:full });
      }catch(e){ toast("Couldn't read that image",1); }
    }
    paint();
  }

  const dz = $("#dz");
  dz.onclick = ()=>$("#s_file").click();
  $("#s_file").onchange = e=>addFiles([...e.target.files]);
  dz.ondragover = e=>{ e.preventDefault(); dz.classList.add("over"); };
  dz.ondragleave = ()=>dz.classList.remove("over");
  dz.ondrop = e=>{ e.preventDefault(); dz.classList.remove("over"); addFiles([...e.dataTransfer.files]); };
  $("#addUrl").onclick = ()=>{
    const u = $("#s_url").value.trim();
    if(!u) return;
    if(!/^https?:\/\//i.test(u)) return toast("That doesn't look like a link",1);
    shots.push({ src:u }); $("#s_url").value=""; paint();
  };
  $("#modalHost")._paste = e=>{
    const files = [...(e.clipboardData&&e.clipboardData.files||[])];
    if(files.length){ e.preventDefault(); addFiles(files); }
  };
  document.addEventListener("paste", $("#modalHost")._paste);

  return {
    // uploads the new ones, then deletes any that were taken off this record
    async commit(previous){
      const out = [];
      for(const e of shots){
        if(e && e._full) out.push({ id: await putImage(e._full), thumb: e.thumb });
        else out.push(e);
      }
      const kept = new Set(out.map(imgId).filter(Boolean));
      for(const old of (previous||[])){
        const id = imgId(old);
        if(id && !kept.has(id)) await dropImage(id);
      }
      return out;
    }
  };
}

// The same deferred-upload deal the gallery gets, one picture at a time:
// nothing is uploaded until you save, and a shot taken off a hack (or a hack
// deleted outright) has its stored image removed with it.
async function commitHackShots(rec, previous){
  for(const k of rec.hacks){
    if(k.shot && k.shot._full) k.shot = { id: await putImage(k.shot._full), thumb: k.shot.thumb };
  }
  const kept = new Set(rec.hacks.map(k=>imgId(k.shot)).filter(Boolean));
  for(const old of ((previous && previous.hacks) || [])){
    const id = imgId(old.shot);
    if(id && !kept.has(id)) await dropImage(id);
  }
}

// A gallery that shows thumbnails immediately and swaps the full-size images
// in behind them once they've loaded.
function galleryHTML(images, key){
  if(!(images||[]).length) return "";
  return `<div class="shots">${images.map((e,i)=>
    `<img src="${esc(imgThumb(e))}" alt="" data-shot="${i}" data-spotid="${esc(key)}">`).join("")}</div>`;
}
function hydrateGallery(images, key, prefix){
  (images||[]).forEach(async (e,i)=>{
    if(!e) return;
    const full = await imgFull(e);
    const el = $(`[data-shot="${(prefix||"")+i}"][data-spotid="${key}"]`);
    if(el && full && el.src !== full) el.src = full;
  });
}

// Screenshots get downscaled before storing. You only need to recognise the
// spot, a raw 4K grab would eat the storage budget on its own, and a Firestore
// record caps out at 1 MB — so the full size is stepped down until it fits
// comfortably, and a small thumbnail is kept alongside it for the listings.
function fileToUrl(f){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = rej; fr.onload = ()=>res(fr.result); fr.readAsDataURL(f);
  });
}
function loadImgEl(src){
  return new Promise((res,rej)=>{
    const i = new Image();
    i.onerror = rej; i.onload = ()=>res(i); i.src = src;
  });
}
function draw(img, max, q){
  const sc = Math.min(1, max/Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width*sc));
  c.height = Math.max(1, Math.round(img.height*sc));
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
async function prepShot(file){
  const img = await loadImgEl(await fileToUrl(file));
  let full = draw(img, 1400, .72);
  for(const [max,q] of [[1400,.62],[1150,.58],[950,.52],[750,.45]]){
    if(full.length <= 700000) break;
    full = draw(img, max, q);
  }
  return { full, thumb: draw(img, 420, .58) };
}

function openItem(id){
  const it = S.items.find(x=>x.id===id); if(!it) return;
  const craft = isCraftable(it);
  const e = craft ? itemEconomics(it) : null;
  const usedIn = S.items.filter(x=>allIngredients(x).some(g=>norm(g.name)===norm(it.name)));
  const gaps = gapsOf(it);
  const per = Math.max(1, recipesOf(it)[0].outputQty||1);

  const moneyStats = craft ? `
      <div class="stat"><div class="k">Cost to craft</div><div class="v gold">${e.missingCost? "—":money(e.cost)}</div>
        ${e.missingCost?`<div class="tiny muted">${e.missingCost} unpriced</div>`:""}</div>
      <div class="stat"><div class="k">Sells for</div><div class="v">${e.revenue==null?"—":money(e.revenue)}</div>
        ${per>1?`<div class="tiny muted">${per} units</div>`:""}</div>
      <div class="stat"><div class="k">Profit</div><div class="v ${e.profit==null?"":(e.profit>=0?"good":"bad")}">${e.profit==null?"—":(e.profit>=0?"+":"")+money(e.profit)}</div></div>` : `
      <div class="stat"><div class="k">Buy price</div><div class="v gold">${money(it.buyCost)}</div></div>
      <div class="stat"><div class="k">Sell price</div><div class="v">${money(it.sellPrice)}</div></div>`;

  const stats = craft ? `
    <div class="stats" style="margin-bottom:18px">
      ${S.money? moneyStats : ""}
      <div class="stat"><div class="k">Total time</div><div class="v">${e.missingTime?"—":dur(e.time)}</div></div>
      <div class="stat"><div class="k">Raw materials</div><div class="v">${e.raw.length}</div></div>
      ${e.steps.length>1? `<div class="stat"><div class="k">Sub-crafts first</div><div class="v">${e.steps.length-1}</div></div>`:""}
    </div>` : `
    <div class="stats" style="margin-bottom:18px">
      ${S.money? moneyStats : ""}
      <div class="stat"><div class="k">On hand</div><div class="v">${S.stock[norm(it.name)]||0}</div></div>
      <div class="stat"><div class="k">Used in</div><div class="v">${usedIn.length}</div></div>
    </div>`;

  // every way of making it, not just the first
  const recs = craft ? recipesOf(it) : [];
  const direct = craft ? recs.map((r,i)=>`
    <div class="sec-title">${recs.length>1
        ? `${r.label? esc(r.label) : "Recipe "+(i+1)}${i===0?" · the one the planner starts with":""}`
        : "Recipe"}${r.outputQty>1?` — makes ${r.outputQty}`:""}</div>
    <div class="recmeta">
      ${r.benchId? `<span class="tag tbench" style="${benchTagStyle(r.benchId)}">${esc(benchName(r.benchId))}</span>`
                 : `<span class="tag" style="color:var(--warn)">no bench set</span>`}
      ${num(r.craftTime)!=null? `<span class="tag">${dur(r.craftTime)}</span>`:""}
      ${r.levelReq? `<span class="tag">lvl ${esc(r.levelReq)}</span>`:""}
      ${r.blueprints.length? `<span class="tag tbp">◆ ${r.blueprints.map(b=>esc(b.name)).join(", ")}</span>`:""}
    </div>
    <div class="tree" style="margin-bottom:18px">
      ${r.ingredients.map(g=>{
        const sub = S.byName.get(norm(g.name));
        const isC = isCraftable(sub);
        return `<div class="tnode ${sub?"":"unknown"}">
          <span class="q">${esc(String(g.qty??"?"))}×</span>
          <span class="nm ${sub?"craftable":""}" ${sub?`data-id="${sub.id}"`:""}>${esc(g.name)}</span>
          <span class="meta">${!sub? "not listed"
            : isC? `craft @ <span style="${recipesOf(sub)[0].benchId?`color:${benchColor(recipesOf(sub)[0].benchId)}`:""}">${esc(benchName(recipesOf(sub)[0].benchId)||"?")}</span>`
            : esc(sub.source||"material")}</span>
        </div>`;
      }).join("")}
    </div>`).join("") : "";

  const deep = (craft && e.steps.length>1) ? `
    <div class="sec-title">Raw materials, all the way down</div>
    <div class="tscroll" style="margin-bottom:18px"><table>
      <thead><tr><th>Material</th><th class="num">Qty</th>${S.money?'<th class="num">Cost</th>':""}<th>Source</th></tr></thead>
      <tbody>${e.raw.map(x=>`<tr>
        <td>${esc(x.name)}</td>
        <td class="num mono">${x.qty}</td>
        ${S.money?`<td class="num mono">${x.item&&num(x.item.buyCost)!=null? money(x.item.buyCost*x.qty):'<span class="muted">—</span>'}</td>`:""}
        <td class="tiny muted">${x.item&&x.item.source? esc(x.item.source):"—"}</td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="sec-title">Sub-crafts first</div>
    <div class="tree" style="margin-bottom:18px">
      ${e.steps.filter(s=>s.item.id!==it.id).map(s=>`<div class="tnode">
        <span class="q">${s.crafts}×</span>
        <span class="nm craftable" data-id="${s.item.id}">${esc(s.item.name)}</span>
        <span class="meta" style="${s.rec.benchId?`color:${benchColor(s.rec.benchId)}`:""}">${esc(benchName(s.rec.benchId)||"bench not set")}</span>
      </div>`).join("")}
    </div>` : "";

  openModal(`
    <div class="mhead">
      <div style="flex:1">
        <h2>${esc(it.name)}</h2>
        <div class="sub">
          ${craft? (altCount(it)? `${altCount(it)+1} ways to make it` :
              (recipesOf(it)[0].benchId? `<span style="color:${benchColor(recipesOf(it)[0].benchId)};font-weight:650">${esc(benchName(recipesOf(it)[0].benchId))}</span>` : "no bench set"))
            : "raw material"}
          ${it.category? " · "+esc(it.category):""}
          ${!altCount(it) && num(recipesOf(it)[0].craftTime)!=null? " · "+dur(recipesOf(it)[0].craftTime):""}
          ${!altCount(it) && recipesOf(it)[0].levelReq? " · level "+esc(recipesOf(it)[0].levelReq):""}
          ${num(it.xp)!=null? " · "+it.xp+" xp":""}
        </div>
      </div>
      <button class="x" data-close>×</button>
    </div>
    <div class="mbody">
      ${stats}
      ${gaps.length? `<div class="card" style="border-color:rgba(251,191,36,.3);margin-bottom:18px;padding:11px 13px">
        <div class="tiny" style="color:var(--warn);font-weight:700">Missing: ${gaps.map(esc).join(" · ")}</div></div>`:""}
      ${direct}
      ${craft && recs.some(r=>r.blueprints.length)? `
      <div class="sec-title">Blueprints required</div>
      <div class="tree" style="margin-bottom:18px">
        ${[...new Map(recs.flatMap(r=>r.blueprints).map(b=>[norm(b.name),b])).values()].map(bp=>{
          const sub = S.byName.get(norm(bp.name));
          const have = ownsBp(bp.name);
          return `<div class="tnode ${sub?"":"unknown"}">
            <span class="q">${bp.consumed? esc(String(bp.qty||1))+"\u00d7" : "\u25c6"}</span>
            <span class="nm ${sub?"craftable":""}" ${sub?`data-id="${sub.id}"`:""}>${esc(bp.name)}</span>
            <span class="meta">${bp.consumed? "used up each craft"
              : (have? `<span style="color:var(--acc)">owned</span>` : `<span style="color:var(--warn)">not owned</span>`)}</span>
          </div>`;
        }).join("")}
      </div>`:""}
      ${deep}
      ${it.source&&!craft? `<div class="sec-title">Where to get it</div><div style="margin-bottom:18px">${esc(it.source)}</div>`:""}
      ${it.notes? `<div class="sec-title">Notes</div><div style="margin-bottom:18px;white-space:pre-wrap">${esc(it.notes)}</div>`:""}
      ${usedIn.length? `<div class="sec-title">Used in</div><div class="chips">${usedIn.map(u=>`<button class="chip" data-id="${u.id}">${esc(u.name)}</button>`).join("")}</div>`:""}
    </div>
    <div class="mfoot">
      ${S.canEdit? `<button class="btn danger" data-del="${it.id}">Delete</button>`:""}
      <div class="spacer"></div>
      ${isCraftable(it)? `<button class="btn" data-plan="${esc(it.name)}">Add to plan</button>`:""}
      ${S.canEdit? `<button class="btn primary" data-edit="${it.id}">Edit</button>`:""}
    </div>`, "wide");
}

function repaintHackShot(key){
  const row = document.querySelector(`#hackList [data-hk="${key}"]`);

/* One hidden file input serves every row; the row waiting on it is remembered
   here rather than cloning an input per hack. */
let hackShotFor = null;
function wireHackShots(){
  const list = $("#hackList"); if(!list) return;
  list.onclick = async e=>{
    const rm = e.target.closest("[data-hkrm]");
    if(rm){ e.preventDefault(); e.stopPropagation();
            delete HACK_SHOTS[rm.dataset.hkrm]; repaintHackShot(rm.dataset.hkrm); return; }
    const b = e.target.closest(".hkshot");
    if(b){ e.preventDefault(); hackShotFor = b.dataset.hk; $("#hackFile").value=""; $("#hackFile").click(); }
  };
  list.ondragover = e=>{ const b=e.target.closest(".hkshot"); if(b){ e.preventDefault(); b.classList.add("over"); } };
  list.ondragleave = e=>{ const b=e.target.closest(".hkshot"); if(b) b.classList.remove("over"); };
  list.ondrop = async e=>{
    const b = e.target.closest(".hkshot"); if(!b) return;
    e.preventDefault(); b.classList.remove("over");
    await takeHackShot(b.dataset.hk, [...e.dataTransfer.files][0]);
  };
  $("#hackFile").onchange = async e=>{
    await takeHackShot(hackShotFor, e.target.files[0]); hackShotFor = null;
  };
}
async function takeHackShot(key, f){
  if(!key || !f || !f.type.startsWith("image/")) return;
  try{
    const {full, thumb} = await prepShot(f);
    HACK_SHOTS[key] = { thumb, _full:full };
    repaintHackShot(key);
  }catch(err){ toast("Couldn't read that image",1); }
}

/* Craft times are stored in seconds, but plenty of recipes are quoted in
   minutes — so the form takes either and the unit you last used sticks. */
const TIMEU_KEY = PFX+"timeunit";
function lastTimeUnit(){ try{ return localStorage.getItem(TIMEU_KEY)==="m" ? "m":"s" }catch(e){ return "s" } }
function timeField(seconds){
  if(seconds==null || !isFinite(seconds)) return { value:"", unit:lastTimeUnit() };
  if(seconds>=60){
    const m = Math.round((seconds/60)*1000)/1000;   // 150s -> 2.5 min
    return { value:m, unit:"m" };
  }
  return { value:seconds, unit:"s" };
}
function timeToSeconds(){
  const v = num($("#e_time").value);
  if(v==null) return null;
  return $("#e_timeu").value==="m" ? v*60 : v;
}
function paintTimePreview(){
  const el = $("#timePreview"); if(!el) return;
  const sec = timeToSeconds();
  el.textContent = sec==null ? "" : (sec<=0 ? "" : "= "+dur(sec)+" per craft");
}

/* ---------------------------------------------------------------------
   Pasting a list of ingredients. Copes with the shapes people actually
   paste — "20x Iron", "Iron x20", "20 Iron", "Iron: 20" — separated by
   newlines, commas or the · this app itself prints.
   --------------------------------------------------------------------- */
const PASTE_NOISE = /^(ingredients?|requirements?|materials?|blueprints?|resulting items?|craft|recipe)\s*:?$/i;

function parseIngredients(text){
  const out = [];
  const chunks = String(text||"")
    .replace(/\+\s*\d+\s*more/gi, "")      // the card's own "+1 more"
    .split(/[\n\r;,·•]+/);

  for(let raw of chunks){
    let c = raw.trim()
      .replace(/^[-*–—\u2022\s]+/, "")        // bullets
      .replace(/[.\s]+$/, "")
      .trim();
    if(!c || PASTE_NOISE.test(c) || /^\d+$/.test(c)) continue;

    let m, name, qty = 1;
    if((m = c.match(/^(\d+(?:[.,]\d+)?)\s*[x×*]\s*(.+)$/i)))      { qty = m[1]; name = m[2]; }
    else if((m = c.match(/^(.+?)\s*[x×*]\s*(\d+(?:[.,]\d+)?)$/i))) { name = m[1]; qty = m[2]; }
    else if((m = c.match(/^(.+?)\s*[:=]\s*(\d+(?:[.,]\d+)?)$/)))   { name = m[1]; qty = m[2]; }
    else if((m = c.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/)))           { qty = m[1]; name = m[2]; }
    else name = c;

    name = String(name).replace(/^[x×*\s]+/i,"").replace(/[\s:=]+$/,"").trim();
    if(!name) continue;
    const n = parseFloat(String(qty).replace(",", "."));
    out.push({ name, qty: isFinite(n) && n > 0 ? n : 1 });
  }
  return out;
}

/* Catch a recipe that eats itself at the moment it's typed, rather than
   letting it surface later as nonsense numbers in the planner. */
function cycleFor(it){
  const start = norm(it.name);
  const refs = x => recipesOf(x).flatMap(r=>[...r.ingredients, ...r.blueprints]).map(g=>g.name).filter(Boolean);
  const seen = new Set();
  const walk = (names, chain) => {
    for(const nm of names){
      const k = norm(nm);
      if(k === start) return [...chain, it.name];
      if(seen.has(k)) continue;
      seen.add(k);
      const sub = S.byName.get(k);
      if(!sub || sub.id === it.id) continue;
      const found = walk(refs(sub), [...chain, sub.name]);
      if(found) return found;
    }
    return null;
  };
  return walk(refs(it), [it.name]);
}

async function saveItemForm(existing){
  const name = $("#e_name").value.trim();
  if(!name) return toast("Give it a name",1);

  const ings = $$("#ingList .ingrow").map(r=>({
    name: r.querySelector(".ing-n").value.trim(),
    qty:  num(r.querySelector(".ing-q").value) || 0
  })).filter(g=>g.name);

  const bps = $$("#bpList .bprow").map(r=>{
    const consumed = r.querySelector(".bp-c").value === "1";
    return { name: r.querySelector(".bp-n").value.trim(),
             consumed,
             qty: consumed ? Math.max(1, parseInt(r.querySelector(".bp-q").value)||1) : 1 };
  }).filter(g=>g.name);

  const dupe = S.items.find(x=>norm(x.name)===norm(name) && x.id!==(existing&&existing.id));
  if(dupe) return toast("Something's already called that",1);

  // straight self-reference is never right, so don't let it be saved
  const altIngs = $$("#altList .altblock .alt-ings .ing-n").map(i=>({name:i.value.trim()})).filter(g=>g.name);
  const selfRef = [...ings, ...bps, ...altIngs].find(g=>norm(g.name)===norm(name));
  if(selfRef) return toast(`"${name}" can't be its own ingredient or blueprint`,1);

  const it = {
    id: existing? existing.id : uid("it"),
    name, category:$("#e_cat").value.trim(), benchId:$("#e_bench").value,
    outputQty: Math.max(1, parseInt($("#e_out").value)||1),
    craftTime: timeToSeconds(), levelReq:$("#e_lvl").value.trim(), xp:num($("#e_xp").value),
    buyCost: num($("#e_buy").value), sellPrice: num($("#e_sell").value),
    source: $("#e_src").value.trim(), notes: $("#e_notes").value.trim(),
    ingredients: ings, blueprints: bps,
    blueprint: !!(existing && existing.blueprint),
    alts: $$("#altList .altblock").map(box=>{
      const rows = [...box.querySelectorAll(".alt-ings .ingrow")].map(r=>({
        name: r.querySelector(".ing-n").value.trim(),
        qty:  num(r.querySelector(".ing-q").value) || 0
      })).filter(g=>g.name);
      const tv = num(box.querySelector(".alt-time").value);
      return {
        label: box.querySelector(".alt-label").value.trim(),
        benchId: box.querySelector(".alt-bench").value,
        outputQty: Math.max(1, parseInt(box.querySelector(".alt-out").value)||1),
        craftTime: tv==null? null : (box.querySelector(".alt-timeu").value==="m" ? tv*60 : tv),
        ingredients: rows, blueprints: []
      };
    }).filter(a=>a.ingredients.length)
  };

  // an indirect loop might be a half-finished edit, so warn rather than block
  const chain = cycleFor(it);
  if(chain && !confirm(
      `This makes a loop:\n\n${chain.join(" → ")}\n\n` +
      `The planner can't work out real totals for a chain that comes back to itself. Save anyway?`)) return;

  try{
    const saved = await Store.saveItem(it);
    upsertLocal(saved);

    // anything named that doesn't exist yet gets created — ingredients as raw
    // materials, blueprints flagged as blueprints so they sort correctly
    let created = 0;
    const stub = (nm, isBp) => ({
      id:uid("it"), name:nm.trim(), category:"", benchId:"", outputQty:1,
      craftTime:null, levelReq:"", xp:null, buyCost:null, sellPrice:null,
      source:"", notes:"", ingredients:[], blueprints:[], blueprint: !!isBp
    });
    for(const g of [...ings, ...(it.alts||[]).flatMap(a=>a.ingredients)]){
      if(S.byName.get(norm(g.name))) continue;
      upsertLocal(await Store.saveItem(stub(g.name, false))); created++;
    }
    for(const g of bps){
      if(S.byName.get(norm(g.name))) continue;
      upsertLocal(await Store.saveItem(stub(g.name, true))); created++;
    }
    closeModal(); render();
    toast(created? `Saved — ${created} new entr${created>1?"ies":"y"} added` : "Saved");
  }catch(err){ console.error(err); toast("Save failed: "+(err.message||err),1); }
}
function upsertLocal(it){
  const i = S.items.findIndex(x=>x.id===it.id);
  if(i>=0) S.items[i]=it; else S.items.push(it);
  reindex();
}

  $$("#b_colors button").forEach(btn=> btn.onclick = ()=>{
    pickedColor = btn.dataset.color;
    $$("#b_colors button").forEach(x=>x.classList.toggle("on", x===btn));
  });

  $("#saveBench").onclick = async ()=>{
    const name = $("#b_name").value.trim();
    if(!name) return toast("Name it",1);
    const rec = { id: b? b.id : uid("bn"), name, location:$("#b_loc").value.trim(),
                  notes:$("#b_notes").value.trim(), color: pickedColor, images: [] };
    const btn = $("#saveBench");
    btn.disabled = true; btn.textContent = "Saving…";
    try{
      rec.images = await shotBox.commit((b&&b.images)||[]);
      const saved = await Store.saveBench(rec);
      const i = S.benches.findIndex(x=>x.id===saved.id);
      if(i>=0) S.benches[i]=saved; else S.benches.push(saved);
      closeModal(); render(); toast("Bench saved");
    }catch(err){
      btn.disabled = false; btn.textContent = "Save";
      toast("Save failed: "+(err.message||err),1);
    }
  };
  if(b) $("#delBench").onclick = async ()=>{
    const n = S.items.filter(i=>i.benchId===b.id).length;
    if(!confirm(`Delete "${b.name}"?${n?` ${n} recipe(s) will lose their bench.`:""}`)) return;
    try{
      const orphaned = S.items.filter(i=>i.benchId===b.id).map(i=>i.id);
      await Store.delBench(b.id);
      S.benches = S.benches.filter(x=>x.id!==b.id);
      for(const it of S.items) if(it.benchId===b.id){ it.benchId=""; await Store.saveItem(it); }
      closeModal(); render();
      offerUndo(`Deleted "${b.name}"`,
        async ()=>{
          S.benches.push(await Store.saveBench(b));
          for(const id of orphaned){                       // put its recipes back on it
            const it = S.items.find(x=>x.id===id);
            if(it){ it.benchId = b.id; await Store.saveItem(it); }
          }
          reindex();
        },
        async ()=>{ for(const e of (b.images||[])){ const id = imgId(e); if(id) await dropImage(id); } });
    }catch(err){ toast("Delete failed",1) }
  };
}

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /boards/{board} {

      function isEditor() {
        return request.auth != null &&
          exists(/databases/$(database)/documents/boards/$(board)/editors/$(request.auth.uid));
      }
      function codeMatches() {
        return request.resource.data.code ==
          get(/databases/$(database)/documents/boards/$(board)/config/access).data.code;
      }

      // the edit code itself: the app can never read it or change it
      match /config/{doc} {
        allow read, write: if false;
      }

      // a device claims editing rights by presenting the code
      match /editors/{uid} {
        allow read:          if request.auth != null && request.auth.uid == uid;
        allow create, update: if request.auth != null && request.auth.uid == uid && codeMatches();
        allow delete:        if false;
      }

      // the manual itself: everyone reads, only editors write
      match /items/{doc}   { allow read: if true; allow write: if isEditor(); }
      match /benches/{doc} { allow read: if true; allow write: if isEditor(); }
      match /spots/{doc}   { allow read: if true; allow write: if isEditor(); }
      match /images/{doc}  { allow read: if true; allow write: if isEditor(); }
    }
  }
}`;

        <div class="stat"><div class="k">Needs attention</div><div class="v ${S.items.filter(i=>gapsOf(i).length).length?"bad":""}">${S.items.filter(i=>gapsOf(i).length).length}</div></div>

      ${!CLOUD && localBytes()>3.4e6? `<div class="card" style="border-color:rgba(251,191,36,.35);margin-bottom:22px;padding:11px 13px">
        <div class="tiny" style="color:var(--warn)"><b>Storage is filling up</b> — about ${Math.round(localBytes()/1e6*10)/10} MB of a browser's ~5 MB limit, mostly screenshots.

      // records only carry thumbnails, so pull the full images in for the backup
      const inline = async e => {
        const id = imgId(e);
        return id ? { id, thumb:imgThumb(e), data: await getImage(id) } : e;
      };
      const inlineImages = async rec => {
        const images = [];
        for(const e of (rec.images||[])) images.push(await inline(e));
        // a heist's hacks carry a picture each — a backup without them isn't one
        const hacks = [];
        for(const k of (rec.hacks||[])) hacks.push(k.shot? { ...k, shot: await inline(k.shot) } : k);
        return rec.hacks ? { ...rec, images, hacks } : { ...rec, images };
      };
      const spots = [];   for(const sp of S.spots)   spots.push(await inlineImages(sp));
      const benches = []; for(const bn of S.benches) benches.push(await inlineImages(bn));
      download("street-manual-backup.json",
        JSON.stringify({v:5, exported:new Date().toISOString(), benches, items:S.items, spots}, null, 2),
        "application/json");
    }catch(err){ toast("Export failed: "+(err.message||err),1); }
    btn.disabled = false; btn.textContent = "Export backup (.json)";
  };

  $("#expCsv").onclick = ()=>{
    const rows = [["Item","Category","Bench","Bench location","Makes","Craft time (s)","Level","XP","Buy cost","Sell price","Source","Ingredient","Ingredient qty","Notes"]];
    for(const it of S.items.slice().sort((a,b)=>a.name.localeCompare(b.name))){
      const b = benchOf(it.benchId)||{};
      const base = [it.name, it.category, b.name||"", b.location||"", it.outputQty||1, it.craftTime??"", it.levelReq, it.xp??"", it.buyCost??"", it.sellPrice??"", it.source];
      if(isCraftable(it)) for(const g of it.ingredients) rows.push([...base, g.name, g.qty, it.notes]);
      else rows.push([...base, "", "", it.notes]);
    }
    download("street-manual-recipes.csv", rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"), "text/csv");
  };

  if($("#impBtn")) $("#impBtn").onclick = ()=>$("#impFile").click();
  if($("#impFile")) $("#impFile").onchange = async e=>{
    const f = e.target.files[0]; if(!f) return;
    try{
      const d = JSON.parse(await f.text());
      if(!Array.isArray(d.items)) throw new Error("That isn't a Street Manual backup");
      const sp = d.spots||[];   // v1 backups predate the spots tabs
      if(!confirm(`Replace everything with ${d.items.length} items, ${(d.benches||[]).length} benches and ${sp.length} saved spots?`)) return;
      toast("Importing…");
      await Store.replaceAll(d.items, [], []);   // clears old screenshots too
      const put = async e => (e && e.data)
        ? { id: await putImage(e.data), thumb: e.thumb || e.data }
        : e;
      const restore = async rec => {
        const images = [];
        for(const e of (rec.images||[])) images.push(await put(e));
        const hacks = [];
        for(const k of (rec.hacks||[])) hacks.push(k.shot? { ...k, shot: await put(k.shot) } : k);
        return rec.hacks ? { ...rec, images, hacks } : { ...rec, images };
      };
      const benches = [];
      for(const one of (d.benches||[])){ const r = await restore(one); await Store.saveBench(r); benches.push(r); }
      const spots = [];
      for(const one of sp){ const r = await restore(one); await Store.saveSpot(r); spots.push(r); }
      S.items = d.items; S.benches = benches; S.spots = spots; reindex();
      closeModal(); render(); toast("Imported");
    }catch(err){ toast("Import failed: "+err.message,1) }
  };

  if($("#wipe")) $("#wipe").onclick = async ()=>{
    if(!confirm("Erase every item, bench, saved spot and screenshot? This cannot be undone.")) return;
    if(!confirm("Really sure? Export a backup first if you're not.")) return;
    await Store.replaceAll([],[],[]);
    S.items=[]; S.benches=[]; S.spots=[]; reindex(); closeModal(); render(); toast("Wiped");
  };
}
function download(name, text, mime){
  const b = new Blob([text],{type:mime});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

function wireView(){
  const q = $("#q");
  if(q){
    q.oninput = e=>{ S.q = e.target.value; const p=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); };
  }
  const fb = $("#fBench");
  if(fb) fb.onchange = e=>{ S.fBench=e.target.value; render(); };
  const fc = $("#fCat");
  if(fc) fc.onchange = e=>{ S.fCat=e.target.value; render(); };

  // clicking an active chip turns it back off
  $$("[data-flag]").forEach(b=> b.onclick = ()=>{ S.fFlag = S.fFlag===b.dataset.flag? "" : b.dataset.flag; render(); });
  const cf = $("#clearFilters");
  if(cf) cf.onclick = ()=>{ S.q=""; S.fBench=""; S.fCat=""; S.fFlag=""; render(); };

  const sq = $("#sq");
  if(sq) sq.oninput = e=>{ S.spotQ = e.target.value; const p=e.target.selectionStart; render(); const n=$("#sq"); n.focus(); n.setSelectionRange(p,p); };
  $$("[data-stag]").forEach(b=> b.onclick = ()=>{ S.spotTag = b.dataset.stag; render(); });

  const ab = $("#addBench1"); if(ab) ab.onclick = ()=>openBench(null);

  // planner
  const pa = $("#planAddBtn");
  if(pa){
    const add = ()=>{
      const n = $("#planAdd").value.trim(); if(!n) return;
      const qy = Math.max(1, parseInt($("#planQty").value)||1);
      const ex = S.targets.find(t=>norm(t.name)===norm(n));
      if(ex) ex.qty += qy; else S.targets.push({name:n, qty:qy});
      $("#planAdd").value=""; $("#planQty").value=1; render(); $("#planAdd").focus();
    };
    pa.onclick = add;
    $("#planAdd").onkeydown = e=>{ if(e.key==="Enter") add(); };
  }
  $$("[data-tq]").forEach(i=> i.onchange = ()=>{ S.targets[+i.dataset.tq].qty = Math.max(1,parseInt(i.value)||1); render(); });
  $$("[data-trm]").forEach(b=> b.onclick = ()=>{ S.targets.splice(+b.dataset.trm,1); render(); });
  const pc = $("#planClear"); if(pc) pc.onclick = ()=>{ S.targets=[]; render(); };
  const us = $("#useStock"); if(us) us.onchange = ()=>{ S.useStock = us.checked; render(); };
  $$("[data-pickfor]").forEach(sel=> sel.onchange = ()=>{
    S.pick[norm(sel.dataset.pickfor)] = sel.value;
    savePick(); render();
  });
  $$("[data-ownbp]").forEach(c=> c.onchange = ()=>{
    const k = norm(c.dataset.ownbp);
    if(c.checked) S.stock[k] = Math.max(1, S.stock[k]||0); else delete S.stock[k];
    saveStock(); render();
  });
  $$("[data-stock]").forEach(i=> i.onchange = ()=>{
    const k = norm(i.dataset.stock);
    const v = Math.max(0, parseInt(i.value)||0);
    if(v) S.stock[k]=v; else delete S.stock[k];
    saveStock(); render();
  });
}

// One delegated handler for everything that opens an item.
document.addEventListener("click", e=>{
  const c = e.target.closest("[data-close]"); if(c){ closeModal(); return; }
  const del = e.target.closest("[data-del]");
  if(del){
    const it = S.items.find(x=>x.id===del.dataset.del); if(!it) return;
    if(!confirm(`Delete "${it.name}"?`)) return;
    Store.delItem(it.id).then(()=>{
      S.items = S.items.filter(x=>x.id!==it.id); reindex(); closeModal(); render();
      offerUndo(`Deleted "${it.name}"`, async ()=>{
        upsertLocal(await Store.saveItem(it));
      });
    }).catch(()=>toast("Delete failed",1));
    return;
  }
  const eb = e.target.closest("[data-editbench]"); if(eb){ openBench(eb.dataset.editbench); return; }
  const ed = e.target.closest("[data-edit]"); if(ed){ openEdit(ed.dataset.edit); return; }
  const pl = e.target.closest("[data-plan]");
  if(pl){
    const n = pl.dataset.plan;
    const ex = S.targets.find(t=>norm(t.name)===norm(n));
    if(ex) ex.qty++; else S.targets.push({name:n, qty:1});
    closeModal(); S.tab="planner"; render(); toast("Added to plan");
    return;
  }
  const tab = e.target.closest("[data-tab]"); if(tab){ S.tab = tab.dataset.tab; S.spotQ=""; S.spotTag=""; render(); return; }

  if(e.target.closest("#previewBtn")){
    S.preview = true; applyEdit(); closeModal(); paintLock(); render();
    toast("Previewing what the crew sees — click the header pill to come back");
    return;
  }
  if(e.target.closest("#lockBtnOff")){
    setLocked(true); S.preview = false; applyEdit(); closeModal(); paintLock(); render();
    toast("Editing off on this browser");
    return;
  }
  if(e.target.closest("#lockBtnOn")){
    setLocked(false); applyEdit(); closeModal(); paintLock(); render();
    toast("Editing back on");
    return;
  }
  const vb = e.target.closest("[data-viewbench]"); if(vb){ openBenchView(vb.dataset.viewbench); return; }
  const ns = e.target.closest("[data-newspot]");  if(ns){ openSpotEdit(null, ns.dataset.newspot); return; }
  const es = e.target.closest("[data-editspot]"); if(es){ openSpotEdit(es.dataset.editspot); return; }
  const ds = e.target.closest("[data-delspot]");
  if(ds){
    const sp = S.spots.find(x=>x.id===ds.dataset.delspot); if(!sp) return;
    if(!confirm(`Delete "${sp.name}"?`)) return;
    Store.delSpot(sp.id).then(()=>{
      S.spots = S.spots.filter(x=>x.id!==sp.id); closeModal(); render();
      offerUndo(`Deleted "${sp.name}"`,
        async ()=>{ const back = await Store.saveSpot(sp); S.spots.push(back); },
        // the hacks' own pictures go with it, same seven-second grace
        async ()=>{ for(const e of [...(sp.images||[]), ...hacksOf(sp).map(k=>k.shot)]){
                      const id = imgId(e); if(id) await dropImage(id); } });
    }).catch(()=>toast("Delete failed",1));
    return;
  }
  const pr = e.target.closest("[data-prep]");
  if(pr){
    const h = S.spots.find(x=>x.id===pr.dataset.prep); if(!h) return;
    let added = 0;
    for(const g of gearOf(h)){
      if(!S.byName.get(norm(g.name))) continue;   // free-text gear can't be planned
      const qty = Math.max(1, parseInt(g.qty)||1);
      const ex = S.targets.find(t=>norm(t.name)===norm(g.name));
      if(ex) ex.qty += qty; else S.targets.push({name:g.name, qty});
      added++;
    }
    closeModal(); S.tab = "planner"; render();
    toast(added? `${added} item${added>1?"s":""} added to the plan` : "Nothing in the catalogue to plan",!added);
    return;
  }
  const sh = e.target.closest("[data-shot]"); if(sh){ openShot(sh.src); return; }
  const sp = e.target.closest("[data-spot]"); if(sp){ openSpot(sp.dataset.spot); return; }

  const idEl = e.target.closest("[data-id]"); if(idEl){ openItem(idEl.dataset.id); return; }
});
